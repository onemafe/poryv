<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Порыв · звуки</title>
<!-- Лаборатория звука: подбор на слух, в игру не входит. Открывается файлом в Chrome/Edge.
     Движок между метками «движок звука» потом переедет в Порыв.html вместе с выбранными настройками. -->
<style>
@font-face { font-family: "Golos Text"; font-weight: 400 700; font-display: swap; src: url("fonts/golos-text-cyrillic.woff2") format("woff2"); unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
@font-face { font-family: "Golos Text"; font-weight: 400 700; font-display: swap; src: url("fonts/golos-text-latin.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+2000-206F, U+2212; }
@font-face { font-family: "Unbounded"; font-weight: 500 700; font-display: swap; src: url("fonts/unbounded-cyrillic.woff2") format("woff2"); unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
@font-face { font-family: "Unbounded"; font-weight: 500 700; font-display: swap; src: url("fonts/unbounded-latin.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+2000-206F, U+2212; }
:root {
  --bg: #dfe7ee; --card: #fff; --line: rgba(30, 50, 75, 0.12); --txt: #1d2f3a; --txt2: rgba(29, 47, 58, 0.64);
  --accent: #f7c21b; --accent-hi: #ffd23f; --accent-ink: #1c1600; --fill: rgba(30, 50, 75, 0.06); --fill2: rgba(30, 50, 75, 0.11);
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--txt); font: 15px/1.45 "Golos Text", "Segoe UI", system-ui, sans-serif; }
button, select, input, textarea { font: inherit; color: inherit; }
h1, h2 { font-family: "Unbounded", "Arial Black", system-ui, sans-serif; font-weight: 600; margin: 0; }
h1 { font-size: 17px; }
h2 { font-size: 15px; }

.bar { position: sticky; top: 0; z-index: 5; background: rgba(223, 231, 238, 0.95); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); }
.bar-in { max-width: 1180px; margin: 0 auto; padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.bar label { display: flex; gap: 6px; align-items: center; color: var(--txt2); font-size: 14px; white-space: nowrap; }
.bar select { padding: 5px 8px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
.keys { color: var(--txt2); font-size: 13px; margin-left: auto; }
.keys kbd { font: 12px ui-monospace, monospace; background: #fff; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }

.wrap { max-width: 1180px; margin: 0 auto; padding: 16px; display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 14px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 10px; }
.card.wide { grid-column: 1 / -1; }
.card header { display: flex; align-items: center; gap: 10px; }
.card header h2 { flex: 1; }
.note { margin: 0; color: var(--txt2); font-size: 14px; }
.stats { margin: 0; font-size: 13px; color: var(--txt2); min-height: 1.4em; }

.btn { padding: 7px 14px; border-radius: 10px; border: 1px solid var(--line); background: #fff; cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: rgba(30, 50, 75, 0.35); }
.btn.main { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.main:hover { background: var(--accent-hi); }
.btn.on { background: #1d2f3a; border-color: #1d2f3a; color: #fff; }

.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { padding: 5px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--fill); cursor: pointer; font-size: 14px; }
.seg button.sel { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }

.sliders { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 6px 18px; }
.sl { display: grid; grid-template-columns: 1fr auto; gap: 0 8px; font-size: 14px; }
.sl span { color: var(--txt2); }
.sl b { font-weight: 500; font-variant-numeric: tabular-nums; }
.sl input { grid-column: 1 / -1; width: 100%; accent-color: #1d2f3a; }

.tbl { overflow-x: auto; }
.loud { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
.loud th, .loud td { text-align: left; padding: 6px 10px 6px 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
.loud th { color: var(--txt2); font-weight: 500; font-size: 13px; }
.loud .ok { color: #23955e; }
.loud .off { color: #c4553d; }

textarea { width: 100%; min-height: 150px; border: 1px solid var(--line); border-radius: 10px; padding: 10px; font: 12px/1.5 ui-monospace, Menlo, monospace; background: var(--fill); resize: vertical; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
</style>
</head>
<body>

<div class="bar"><div class="bar-in">
  <h1>Звуки</h1>
  <label>Тональность <select id="key"></select></label>
  <label>Общая громкость <input id="master" type="range" min="0" max="1" step="0.01"></label>
  <label>Размер зала <input id="room" type="range" min="0" max="1" step="0.05"></label>
  <button class="btn" id="sceneWin">Сценка: победа</button>
  <button class="btn" id="sceneFail">Сценка: провал</button>
  <span class="keys"><kbd>Пробел</kbd> музыка · <kbd>1</kbd>–<kbd>4</kbd> звуки</span>
</div></div>

<main class="wrap" id="cards"></main>

<script>
// ==================== движок звука: начало ====================
// Всё синтезируется кодом, файлов нет. Музыка считается один раз в буфер и играет петлёй:
// на слабом телефоне петля из буфера почти ничего не стоит, а живой синтез каждой ноты стоил бы.
// Все ноты берутся из одного лада (мажорная пентатоника тональности), поэтому звуки ложатся на музыку.
const Sound = (() => {
  const DEFAULTS = {
    key: 0, master: 0.8, duck: 0.65, room: 0.5,   // room — размер зала, общий для музыки и звуков
    music: { prog: 0, bpm: 72, swing: 0.58, warmth: 3600, tape: 10, vinyl: 0.5, drums: 0.8, bass: 0.8, keys: 0.9, melody: 0.6, reverb: 1, comp: 0.5, bars: 8, volume: 0.9 },
    tap:  { v: 0, volume: 0.7, pitch: 0, spread: 2, length: 1, reverb: 0 },
    chop: { v: 0, volume: 0.8, pitch: 0, length: 1, reverb: 0.1 },
    win:  { v: 0, volume: 0.7, octave: 0, pace: 1, length: 1, reverb: 0.4 },
    fail: { v: 0, volume: 0.7, octave: 0, length: 1, reverb: 0.3 },
  };
  // аккорды: [бас, [голоса]] в до мажоре, сдвигаются тональностью
  const PROGS = [
    { name: 'Спуск', chords: [[41, [57, 60, 64, 67]], [40, [55, 59, 62, 64]], [38, [53, 57, 60, 64]], [36, [52, 55, 59, 62]]] },
    { name: 'Тёплый круг', chords: [[36, [52, 55, 59, 62]], [45, [55, 59, 60, 64]], [38, [53, 57, 60, 64]], [43, [53, 57, 59, 64]]] },
    { name: 'Задумчивый', chords: [[45, [55, 59, 60, 64]], [41, [52, 57, 60, 64]], [38, [53, 57, 60, 64]], [40, [56, 59, 62, 65]]] },
  ];
  const P5 = [0, 2, 4, 7, 9];
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
  const penta = (root, deg) => root + 12 * Math.floor(deg / 5) + P5[((deg % 5) + 5) % 5];
  function rng(seed) {
    return () => { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  }

  // ---------- кирпичики ----------
  const noises = new WeakMap();
  function noise(c) {
    let b = noises.get(c);
    if (!b) {
      const n = c.sampleRate * 2, r = rng(7); b = c.createBuffer(1, n, c.sampleRate);
      const d = b.getChannelData(0); for (let i = 0; i < n; i++) d[i] = r() * 2 - 1;
      noises.set(c, b);
    }
    return b;
  }
  function osc(c, type, f, t, end) { const o = c.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, t); o.start(t); o.stop(end); return o; }
  function gain(c, v, to) { const g = c.createGain(); g.gain.value = v; if (to) g.connect(to); return g; }
  function filter(c, type, f, q, to) { const fl = c.createBiquadFilter(); fl.type = type; fl.frequency.value = f; fl.Q.value = q; if (to) fl.connect(to); return fl; }
  // удар: подъём за attack, спад почти до нуля за decay
  function hit(g, t, peak, decay, attack = 0.003) { g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(peak, t + attack); g.gain.setTargetAtTime(0, t + attack, decay / 3); }
  function nz(c, out, t, type, f, q, peak, decay) {
    const n = c.createBufferSource(); n.buffer = noise(c);
    const g = gain(c, 0, out); hit(g, t, peak, decay, 0.001);
    n.connect(filter(c, type, f, q, g)); n.start(t, Math.random() * 1.5); n.stop(t + decay * 2 + 0.05);
  }
  function ir(c, sec, pow, r) {
    const n = Math.floor(sec * c.sampleRate), b = c.createBuffer(2, n, c.sampleRate);
    for (let ch = 0; ch < 2; ch++) { const d = b.getChannelData(ch); for (let i = 0; i < n; i++) d[i] = (r() * 2 - 1) * Math.pow(1 - i / n, pow); }
    return b;
  }

  // ---------- голоса ----------
  const V = {
    // электропиано: частотная модуляция 1:1 даёт тёплый «родес», сверху короткий звон
    ep(c, out, t, m, dur, vel, wob) {
      const f = mtof(m), end = t + dur + 1.2;
      const car = osc(c, 'sine', f, t, end), mod = osc(c, 'sine', f, t, end), mg = gain(c, 0), g = gain(c, 0, out);
      mg.gain.setValueAtTime(f * (0.8 + 1.6 * vel), t); mg.gain.setTargetAtTime(f * 0.18, t, 0.35);
      mod.connect(mg).connect(car.frequency); car.connect(g);
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vel * 0.2, t + 0.005);
      g.gain.setTargetAtTime(vel * 0.09, t + 0.005, 0.5); g.gain.setTargetAtTime(0, t + dur, 0.15);
      const tine = osc(c, 'sine', f * 4, t, t + 0.4), tg = gain(c, 0, out); hit(tg, t, vel * 0.025, 0.12); tine.connect(tg);
      if (wob) { wob.connect(car.detune); wob.connect(mod.detune); }
    },
    bass(c, out, t, m, dur, vel, wob) {
      const f = mtof(m), end = t + dur + 0.4;
      const a = osc(c, 'triangle', f, t, end), b = osc(c, 'sine', f, t, end), g = gain(c, 0, out), lp = filter(c, 'lowpass', 520, 0.5, g);
      a.connect(gain(c, 0.45, lp)); b.connect(lp);
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vel * 0.5, t + 0.012);
      g.gain.setTargetAtTime(vel * 0.32, t + 0.012, 0.25); g.gain.setTargetAtTime(0, t + dur, 0.06);
      if (wob) { wob.connect(a.detune); wob.connect(b.detune); }
    },
    marimba(c, out, t, m, vel, len = 1) {
      const f = mtof(m), d = 0.5 * len;
      const a = osc(c, 'sine', f, t, t + d * 2 + 0.05), ag = gain(c, 0, out); hit(ag, t, vel * 0.5, d, 0.002); a.connect(ag);
      const b = osc(c, 'sine', f * 3.93, t, t + 0.25), bg = gain(c, 0, out); hit(bg, t, vel * 0.12, 0.06 * len, 0.001); b.connect(bg);
    },
    bell(c, out, t, m, vel, len = 1) {
      const f = mtof(m), d = 1.4 * len, end = t + d * 2;
      const car = osc(c, 'sine', f, t, end), mod = osc(c, 'sine', f * 3.5, t, end), mg = gain(c, 0), g = gain(c, 0, out);
      mg.gain.setValueAtTime(f * 2.2, t); mg.gain.setTargetAtTime(f * 0.1, t, d / 4);
      mod.connect(mg).connect(car.frequency); car.connect(g); hit(g, t, vel * 0.22, d, 0.002);
    },
    wood(c, out, t, m, vel, len) {
      const f = mtof(m);
      const a = osc(c, 'sine', f, t, t + 0.3), ag = gain(c, 0, out);
      a.frequency.exponentialRampToValueAtTime(f * 0.85, t + 0.05); hit(ag, t, vel * 0.6, 0.07 * len, 0.001); a.connect(ag);
      const b = osc(c, 'triangle', f * 2.3, t, t + 0.15), bg = gain(c, 0, out); hit(bg, t, vel * 0.1, 0.025 * len, 0.001); b.connect(bg);
      nz(c, out, t, 'bandpass', f * 2, 3, vel * 0.15, 0.015);
    },
    drop(c, out, t, m, vel, len) {
      const f = mtof(m), o = osc(c, 'sine', f * 0.6, t, t + 0.4), g = gain(c, 0, out);
      o.frequency.exponentialRampToValueAtTime(f * 1.25, t + 0.06 * len); hit(g, t, vel * 0.55, 0.1 * len, 0.004); o.connect(g);
    },
  };

  // ---------- звуки игры ----------
  let lastTap = null;
  const SFX = {
    // один звук на все нажатия; высота гуляет по соседним ступеням лада и не повторяется подряд
    tap(c, out, t, s, root) {
      let deg = s.pitch + (s.spread ? Math.round((Math.random() * 2 - 1) * s.spread) : 0);
      if (s.spread && deg === lastTap) deg += Math.random() < 0.5 ? 1 : -1;
      lastTap = deg;
      const vel = 0.85 + Math.random() * 0.15;
      if (s.v === 0) V.wood(c, out, t, penta(root + 12, deg + 3), vel, s.length);
      else if (s.v === 1) V.drop(c, out, t, penta(root + 12, deg), vel, s.length);
      else V.marimba(c, out, t, penta(root + 12, deg), vel * 0.9, s.length * 0.6);
      return 0;
    },
    chop(c, out, t, s) {
      const p = Math.pow(2, s.pitch / 12), L = s.length, v = s.v;
      if (v === 2) {   // только треск щепок, без удара
        for (let i = 0; i < 7; i++) nz(c, out, t + (i ? Math.random() * 0.16 * L : 0), 'highpass', 2500 * p, 0.7, 6 * (0.08 + Math.random() * 0.14), 0.012);
        return 0;
      }
      const k = osc(c, 'sine', 160 * p, t, t + 0.5), kg = gain(c, 0, out);   // удар обуха
      k.frequency.exponentialRampToValueAtTime(55 * p, t + 0.08 * L); hit(kg, t, v === 1 ? 0.9 : 0.7, 0.16 * L, 0.001); k.connect(kg);
      nz(c, out, t, 'bandpass', 2400 * p, 1.1, v === 1 ? 0.12 : 0.45, 0.06 * L);   // лезвие входит в дерево
      (v === 1 ? [300, 470] : [390, 640, 1150]).forEach((f, i) => {   // древесина
        const o = osc(c, 'sine', f * p, t, t + 0.5), g = gain(c, 0, out);
        hit(g, t, [0.25, 0.15, 0.08][i], [0.13, 0.09, 0.05][i] * L, 0.001); o.connect(g);
      });
      return 0;
    },
    win(c, out, t, s, root) {
      const o = 12 * s.octave, gap = 0.085 * s.pace, L = s.length;
      if (s.v === 0) [0, 2, 3, 5].forEach((d, i) => V.marimba(c, out, t + i * gap, penta(root + 12, d) + o, i === 3 ? 1 : 0.8, L * (i === 3 ? 2 : 1)));
      else if (s.v === 1) [3, 5, 7, 8].forEach((d, i) => V.bell(c, out, t + i * gap * 1.3, penta(root + 12, d) + o, 0.7 + i * 0.1, L));
      else if (s.v === 2) [0, 4, 7, 11, 14].forEach((d, i) => V.ep(c, out, t + i * gap * 0.7, root + 12 + d + o, 0.9 * L, 0.7));
      else {   // тот же приглушённый инструмент, что у провала «Вниз», только ноты идут вверх
        const lp = filter(c, 'lowpass', 1600, 0.5, out);
        [2, 3, 5].forEach((d, i) => V.ep(c, lp, t + i * 0.17 * s.pace, penta(root, d) + o, i === 2 ? 0.8 * L : 0.18 * L, 0.65));
      }
      return 1.0 * L + 0.3 * s.pace;
    },
    fail(c, out, t, s, root) {
      const o = 12 * s.octave, L = s.length;
      if (s.v === 0) {   // три ноты вниз, к минору
        const lp = filter(c, 'lowpass', 1600, 0.5, out);
        [2, 1, -1].forEach((d, i) => V.ep(c, lp, t + i * 0.17, penta(root, d) + o, i === 2 ? 0.6 * L : 0.18 * L, 0.65));
      } else if (s.v === 1) {   // «ва — ва-а-а»: вторая нота сползает с дрожью
        const lp = filter(c, 'lowpass', 1400, 0.5, out), t2 = t + 0.2, slide = 0.5 * L;
        const a = osc(c, 'triangle', mtof(penta(root, 2) + o), t, t2 + 0.12 + slide + 0.6), g = gain(c, 0, lp); a.connect(g);
        g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.35, t + 0.02); g.gain.setTargetAtTime(0, t + 0.12, 0.03);
        a.frequency.setValueAtTime(mtof(penta(root, 1) + o), t2); a.frequency.setValueAtTime(mtof(penta(root, 1) + o), t2 + 0.12);
        a.frequency.exponentialRampToValueAtTime(mtof(penta(root, -1) + o), t2 + 0.12 + slide);
        g.gain.setValueAtTime(0, t2); g.gain.linearRampToValueAtTime(0.38, t2 + 0.03);
        g.gain.setTargetAtTime(0.25, t2 + 0.03, 0.2); g.gain.setTargetAtTime(0, t2 + 0.12 + slide, 0.12);
        const lfo = osc(c, 'sine', 5.5, t2, t2 + 0.12 + slide + 0.6), lg = gain(c, 0);
        lg.gain.setValueAtTime(0, t2 + 0.1); lg.gain.linearRampToValueAtTime(30, t2 + 0.12 + slide);
        lfo.connect(lg).connect(a.detune);
      } else {   // глухой аккорд: «эх»
        const lp = filter(c, 'lowpass', 900, 0.5, out);
        [-10, -7, -3, 0].forEach((d, i) => V.ep(c, lp, t + i * 0.015, root + d + o, 0.45 * L, 0.55));
        V.bass(c, lp, t, root - 22 + o, 0.5 * L, 0.7);
      }
      return 0.9 * L;
    },
  };

  // ---------- музыка: считается прямо в массивах ----------
  // Не через OfflineAudioContext: там каждая нота оставляет живые узлы, и 8 тактов собирались 3,5 с даже на ПК.
  // Петля замкнута: хвосты нот, реверберация и фильтры переходят через конец в начало, шва нет.
  // Голоса D повторяют голоса V (те играют звуки игры вживую).
  const TAB = 4096, SIN = new Float32Array(TAB);
  for (let i = 0; i < TAB; i++) SIN[i] = Math.sin(2 * Math.PI * i / TAB);
  const sin1 = ph => SIN[(ph * TAB | 0) & (TAB - 1)];   // ph — в оборотах
  const decay = (tau, sr) => Math.exp(-1 / (tau * sr));
  const toward = (tau, sr) => 1 - Math.exp(-1 / (tau * sr));
  function bq(type, f, q, sr) {
    const w = 2 * Math.PI * f / sr, cs = Math.cos(w), al = Math.sin(w) / (2 * q);
    const b = type === 'lowpass' ? [(1 - cs) / 2, 1 - cs, (1 - cs) / 2] : type === 'highpass' ? [(1 + cs) / 2, -(1 + cs), (1 + cs) / 2] : [al, 0, -al];
    const a0 = 1 + al;
    return [b[0] / a0, b[1] / a0, b[2] / a0, -2 * cs / a0, (1 - al) / a0];
  }
  // фильтр по кругу: сначала прогоняем конец петли, чтобы набралось состояние, потом пишем всё
  function filt(x, co, warm) {
    const [b0, b1, b2, a1, a2] = co, N = x.length;
    let x1 = 0, x2 = 0, y1 = 0, y2 = 0;
    for (let k = -Math.min(warm, N); k < N; k++) {
      const n = k < 0 ? k + N : k, xi = x[n], y = b0 * xi + b1 * x1 + b2 * x2 - a1 * y1 - a2 * y2;
      x2 = x1; x1 = xi; y2 = y1; y1 = y;
      if (k >= 0) x[n] = y;
    }
  }
  // реверберация Шрёдера: 4 гребёнки и 2 всепропускающих, правый канал чуть длиннее
  function reverb(x, sr, warm, fb) {
    const N = x.length, sc = sr / 44100;
    return [0, 23].map(sp => {
      const cb = [1116, 1277, 1422, 1557].map(l => new Float32Array(Math.round((l + sp) * sc))), ci = [0, 0, 0, 0], cf = [0, 0, 0, 0];
      const ab = [556, 341].map(l => new Float32Array(Math.round((l + sp) * sc))), ai = [0, 0];
      const y = new Float32Array(N), damp = 0.3;

  function pause() { paused = true; if (ctx) ctx.suspend(); }

  // ---------- замер громкости (только для лаборатории, в игру не переносить) ----------
  // звук целиком через ту же цепь, что в игре: громкость звука, зал, общая громкость, ограничитель
  async function renderSfx(name) {
    const sr = 48000, OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext, c = new OAC(2, sr * 3, sr);
    const bus = gain(c, 1, gain(c, cfg.master, limiter(c))), vin = gain(c, 1), cv = c.createConvolver();
    cv.buffer = ir(c, 0.6 + 2.4 * cfg.room, 3, rng(3));
    vin.connect(cv).connect(filter(c, 'lowpass', 4000, 0.5, gain(c, 5, bus)));
    voice(c, bus, vin, name, 0.05);
    const b = await c.startRendering();
    return loudness([b.getChannelData(0), b.getChannelData(1)], sr);
  }
  async function measure() {
    if (!ensure()) return null;
    const res = {}, mb = buf || (await build()).buffer, g = cfg.music.volume * cfg.master;
    res.music = loudness([0, 1].map(ch => mb.getChannelData(ch).map(v => v * g)), mb.sampleRate);
    for (const name of ['tap', 'chop', 'win', 'fail']) {
      // у «тука» и треска есть случайность — берём среднее из нескольких; победа и провал всегда одинаковы
      const runs = [];
      for (let i = 0, n = name === 'tap' || name === 'chop' ? 8 : 1; i < n; i++) runs.push(await renderSfx(name));
      const avg = key => runs.reduce((a, r) => a + r[key], 0) / runs.length;
      res[name] = { momentary: avg('momentary'), integrated: avg('integrated'), peak: Math.max(...runs.map(r => r.peak)) };
    }
    return res;
  }

  const api = { DEFAULTS, PROGS, cfg, play, startMusic, stopMusic, invalidate, setVolumes, setRoom, pause, resume, measure, loudness, unlock: ensure,
    get playing() { return musicOn; }, get stats() { return stats; }, onStats: null };
  return api;
})();
// ==================== движок звука: конец ====================

const STORE = 'poryv-sound-lab';
const $ = s => document.querySelector(s);
const pct = v => Math.round(v * 100) + ' %';
const num = v => String(v).replace('.', ',');
const sign = v => (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v);
const times = v => '×' + num(Math.round(v * 100) / 100);

function load() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORE) || 'null');
    if (!saved) return;
    for (const k of Object.keys(Sound.cfg)) {
      if (!(k in saved)) continue;
      if (typeof Sound.cfg[k] === 'object') Object.assign(Sound.cfg[k], saved[k]); else Sound.cfg[k] = saved[k];
    }
  } catch (e) { /* испорченное сохранение — берём по умолчанию */ }
}
function save() {
  try { localStorage.setItem(STORE, JSON.stringify(Sound.cfg)); } catch (e) {}
  const box = $('#json'); if (box) box.value = dump();
}
function dump() {
  const c = Sound.cfg;
  return '{\n' + Object.keys(c).map(k => `  "${k}": ${JSON.stringify(c[k])}`).join(',\n') + '\n}';
}

function slider(sec, key, label, min, max, step, fmt, onChange) {
  const el = document.createElement('label'); el.className = 'sl';
  const val = sec ? Sound.cfg[sec][key] : Sound.cfg[key];
  el.innerHTML = `<span>${label}</span><b></b><input type="range" min="${min}" max="${max}" step="${step}">`;
  const inp = el.querySelector('input'), out = el.querySelector('b');
  inp.value = val; out.textContent = fmt(val);
  inp.addEventListener('input', () => {
    const v = Number(inp.value);
    if (sec) Sound.cfg[sec][key] = v; else Sound.cfg[key] = v;
    out.textContent = fmt(v); save(); onChange && onChange('input', key);
  });
  inp.addEventListener('change', () => onChange && onChange('change', key));
  syncers.push(() => { const v = sec ? Sound.cfg[sec][key] : Sound.cfg[key]; inp.value = v; out.textContent = fmt(v); });
  return el;
}
const syncers = [];   // подтянуть ползунки к настройкам, когда их поменял не человек

// ---------- громкость: замер и выравнивание ----------
// Ориентиры при общей громкости 100 %: музыка — подложка, «тук» и рубка чуть тише неё (звучат часто;
// у треска к тому же острые пики), итоги уровня громче музыки — их надо услышать.
// Вся игра выходит около −18 LUFS, как советуют для портативных игр.
const TARGETS = { music: -19, tap: -21, chop: -21, win: -16, fail: -17 };
const LOUD_ROWS = [['music', 'Музыка', 'integrated'], ['tap', '«Тук»', 'momentary'], ['chop', 'Рубка', 'momentary'], ['win', 'Победа', 'momentary'], ['fail', 'Провал', 'momentary']];
const f1 = v => (v < 0 ? '−' : '') + num(Math.abs(v).toFixed(1));
function loudCard(root) {
  const el = document.createElement('section'); el.className = 'card wide';
  el.innerHTML = `<header><h2>Громкость</h2><button class="btn" id="align">Выровнять по ориентирам</button><button class="btn main" id="measure">Измерить</button></header>
    <p class="note">Громкость в LUFS — как её слышит ухо, а не по размаху волны. Стандарта для браузерных игр нет; для сравнения:
    музыка в стримингах около −14, телевидение −23, для портативных игр советуют около −18 в среднем по игре.
    «Выровнять» ставит общую громкость на 100 % и подгоняет громкость каждого звука под ориентир. Потом послушайте «Сценки» и поправьте на слух.</p>
    <div class="tbl"><table class="loud"><thead><tr><th>Звук</th><th>Сейчас, LUFS</th><th>Ориентир</th><th>Разница</th><th>Пик, dBFS</th></tr></thead><tbody></tbody></table></div>
    <p class="stats" id="loudNote">Нажмите «Измерить».</p>`;
  root.appendChild(el);
  $('#measure').addEventListener('click', showLoud);
  $('#align').addEventListener('click', align);
}
async function showLoud() {
  const note = $('#loudNote'); note.textContent = 'Меряю…';
  const m = await Sound.measure();
  if (!m) { note.textContent = 'Браузер не умеет звук.'; return null; }
  const tb = $('.loud tbody'); tb.innerHTML = '';
  for (const [id, name, kind] of LOUD_ROWS) {
    const v = m[id][kind], d = v - TARGETS[id], ok = Math.abs(d) <= 1, tr = document.createElement('tr');
    tr.innerHTML = `<td>${name}</td><td>${f1(v)}</td><td>${f1(TARGETS[id])}</td>` +
      `<td class="${ok ? 'ok' : 'off'}">${ok ? 'в норме' : (d > 0 ? 'громче на ' : 'тише на ') + f1(Math.abs(d)) + ' дБ'}</td>` +
      `<td class="${m[id].peak > -1 ? 'off' : ''}">${f1(m[id].peak)}</td>`;
    tb.appendChild(tr);
  }
  note.textContent = 'Музыка — средняя громкость по всей петле, звуки — самый громкий момент (окно 0,4 с). Пик выше −1 dBFS — риск хрипа в динамике телефона.';
  return m;
}
async function align() {
  Sound.unlock();
  Sound.cfg.master = 1; $('#master').value = 1; Sound.setVolumes();
  const m = await showLoud();
  if (!m) return;
  const short = [];
  for (const [id, name, kind] of LOUD_ROWS) {
    const max = id === 'music' ? 1 : 1.5;
    let v = Sound.cfg[id].volume * Math.pow(10, (TARGETS[id] - m[id][kind]) / 20);
    if (v > max) { short.push(name); v = max; }
    Sound.cfg[id].volume = Math.round(v * 100) / 100;
  }
  save(); Sound.setVolumes(); syncers.forEach(f => f());
  await showLoud();
  if (short.length) $('#loudNote').textContent += ' Не хватило запаса громкости: ' + short.join(', ') + ' — скажите, подниму в самом звуке.';
}

let musicBtn, statsEl, rebuildTimer = 0;
function musicChanged(kind, key) {
  if (key === 'volume') { Sound.setVolumes(); return; }
  clearTimeout(rebuildTimer);
  if (statsEl) statsEl.textContent = 'Пересобираю…';
  rebuildTimer = setTimeout(() => { Sound.invalidate(); if (!Sound.playing && statsEl) statsEl.textContent = 'Соберётся при запуске.'; }, 350);
}
async function toggleMusic() {
  Sound.unlock();
  if (Sound.playing) { Sound.stopMusic(); syncMusicBtn(); return; }
  if (!Sound.stats || statsEl.textContent.startsWith('Соберётся')) statsEl.textContent = 'Собираю…';
  const p = Sound.startMusic(); syncMusicBtn(); await p;
}
function syncMusicBtn() { musicBtn.textContent = Sound.playing ? '■ Стоп' : '▶ Играть'; musicBtn.classList.toggle('on', Sound.playing); }
Sound.onStats = s => {
  statsEl.textContent = `Собрано за ${s.ms} мс · петля ${num(s.len.toFixed(1))} с · громкость при 100 % — −18 LUFS` +
    (s.comp.max ? ` · компрессор прижимает в среднем на ${num(s.comp.avg.toFixed(1))} дБ, самое большее на ${num(s.comp.max.toFixed(1))} дБ` : '') +
    (s.clip > 0.5 ? ` · пики срезаны на ${num(s.clip.toFixed(1))} дБ` : '') + '. ' +
    'На слабом телефоне сборка в 5–10 раз дольше, она идёт один раз после загрузки.';
};

function buildCards() {
  const root = $('#cards');
  for (const card of CARDS) {
    const el = document.createElement('section'); el.className = 'card' + (card.wide ? ' wide' : '');
    el.innerHTML = `<header><h2>${card.title}</h2><button class="btn main"></button></header><p class="note">${card.note}</p><div class="seg"></div><div class="sliders"></div>`;
    const btn = el.querySelector('header .btn'), seg = el.querySelector('.seg'), sl = el.querySelector('.sliders');
    const isMusic = card.id === 'music', vkey = card.vkey || 'v';
    if (isMusic) {
      musicBtn = btn; btn.addEventListener('click', toggleMusic); syncMusicBtn();
      statsEl = document.createElement('p'); statsEl.className = 'stats'; statsEl.textContent = 'Соберётся при запуске.';
      el.insertBefore(statsEl, seg);
    } else {
      btn.textContent = '▶ Послушать';
      btn.addEventListener('click', () => Sound.play(card.id));
    }
    card.variants.forEach((name, i) => {
      const b = document.createElement('button'); b.textContent = name;
      b.classList.toggle('sel', Sound.cfg[card.id][vkey] === i);
      b.addEventListener('click', () => {
        Sound.unlock(); Sound.cfg[card.id][vkey] = i; save();
        seg.querySelectorAll('button').forEach((x, j) => x.classList.toggle('sel', j === i));
        if (isMusic) musicChanged('change', vkey); else Sound.play(card.id);
      });
      seg.appendChild(b);
    });
    for (const [key, label, min, max, step, fmt] of card.sliders) {
      sl.appendChild(slider(card.id, key, label, min, max, step, fmt, isMusic ? musicChanged : (kind) => { if (kind === 'change') Sound.play(card.id); }));
    }
    if (isMusic) sl.appendChild(slider(null, 'duck', 'Приседание на победе и провале', 0, 1, 0.05, pct));
    root.appendChild(el);
  }
  loudCard(root);
  const box = document.createElement('section'); box.className = 'card wide';
  box.innerHTML = `<header><h2>Настройки</h2></header>
    <p class="note">Всё, что выбрано выше, хранится в этом браузере. «Сохранить» записывает настройки в <b>tools/sound.json</b> в папке игры — оттуда я их и прочитаю. В первый раз браузер спросит папку: выберите WindGame.</p>
    <textarea id="json" readonly></textarea>
    <div class="row"><button class="btn main" id="save">Сохранить</button><button class="btn" id="copy">Скопировать</button><button class="btn" id="reset">Сбросить всё</button><span class="note" id="copied"></span></div>`;
  root.appendChild(box);
  $('#json').value = dump();
  $('#save').addEventListener('click', saveFile);
  $('#copy').addEventListener('click', async () => {
    const t = $('#json');
    try { await navigator.clipboard.writeText(t.value); } catch (e) { t.select(); document.execCommand('copy'); }
    $('#copied').textContent = 'Скопировано'; setTimeout(() => $('#copied').textContent = '', 1500);
  });
  let armed = 0;
  $('#reset').addEventListener('click', e => {
    if (!armed) { e.target.textContent = 'Точно сбросить?'; armed = setTimeout(() => { armed = 0; e.target.textContent = 'Сбросить всё'; }, 3000); return; }
    try { localStorage.removeItem(STORE); } catch (err) {}
    location.reload();
  });
}

// ---------- запись в tools/sound.json (File System Access, Chrome/Edge) ----------
// Папку выбирают один раз; доступ хранится в той же базе, что у Тексты.html, поэтому папка может быть уже выбрана.
let dirHandle = null;
function idb(mode, fn) {
  return new Promise((ok, fail) => {
    const r = indexedDB.open('poryv-texts', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('h');
    r.onerror = () => fail(r.error);
    r.onsuccess = () => { const tx = r.result.transaction('h', mode); const q = fn(tx.objectStore('h')); tx.oncomplete = () => ok(q.result); tx.onerror = () => fail(tx.error); };
  });
}
idb('readonly', s => s.get('dir')).then(h => { dirHandle = h || null; }).catch(() => {});
async function saveFile() {
  const say = t => { $('#copied').textContent = t; };
  if (!window.showDirectoryPicker) { say('Этот браузер не умеет писать файлы — откройте страницу в Chrome или Edge или нажмите «Скопировать».'); return; }
  try {
    // окно выбора и вопрос о доступе браузер показывает только сразу после клика — поэтому они первыми
    let h = dirHandle;
    if (h && await h.requestPermission({ mode: 'readwrite' }) !== 'granted') h = null;
    if (!h) h = await showDirectoryPicker({ id: 'poryv', mode: 'readwrite' });
    try { await h.getFileHandle('Порыв.html'); } catch (e) { say('В этой папке нет Порыв.html — выберите папку игры WindGame.'); return; }
    dirHandle = h;
    try { await idb('readwrite', s => s.put(h, 'dir')); } catch (e) {}
    const f = await (await h.getDirectoryHandle('tools', { create: true })).getFileHandle('sound.json', { create: true });
    const w = await f.createWritable(); await w.write(dump() + '\n'); await w.close();
    say('Сохранено в tools/sound.json, ' + new Date().toLocaleTimeString('ru', { hour: '2-digit', minute: '2-digit' }));
  } catch (e) {
    say(e.name === 'AbortError' ? 'Папку не выбрали — ничего не сохранено.' : 'Не сохранилось: ' + e.message);
  }
}

function buildBar() {
  const keys = [['C (до)', 0], ['D (ре)', 2], ['E♭ (ми-бемоль)', 3], ['E (ми)', 4], ['F (фа)', 5], ['G (соль)', -5], ['A (ля)', -3], ['B♭ (си-бемоль)', -2]];
  const sel = $('#key');
  keys.forEach(([n, v]) => { const o = document.createElement('option'); o.value = v; o.textContent = n; sel.appendChild(o); });
  sel.value = Sound.cfg.key;
  sel.addEventListener('change', () => { Sound.cfg.key = Number(sel.value); save(); musicChanged('change', 'key'); });
  const room = $('#room'); room.value = Sound.cfg.room;
  room.addEventListener('input', () => { Sound.cfg.room = Number(room.value); save(); });
  room.addEventListener('change', () => { Sound.setRoom(); musicChanged('change', 'room'); Sound.play('win'); });
  const m = $('#master'); m.value = Sound.cfg.master;
  m.addEventListener('input', () => { Sound.cfg.master = Number(m.value); save(); Sound.setVolumes(); });
  $('#sceneWin').addEventListener('click', () => scene('win'));
  $('#sceneFail').addEventListener('click', () => scene('fail'));
}

// сценка: музыка, несколько нажатий, потом итог — чтобы услышать всё вместе
async function scene(kind) {
  Sound.unlock();
  let lead = 0;
  if (!Sound.playing) { await Sound.startMusic(); syncMusicBtn(); lead = 1500; }
  [0, 550, 1000, 1700, 2200].forEach(ms => setTimeout(() => Sound.play('tap'), lead + ms));
  setTimeout(() => Sound.play(kind), lead + 3400);
}

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT' || e.repeat) return;
  if (e.code === 'Space') { e.preventDefault(); toggleMusic(); return; }
  const n = ['Digit1', 'Digit2', 'Digit3', 'Digit4'].indexOf(e.code);
  if (n >= 0) Sound.play(['tap', 'chop', 'win', 'fail'][n]);
});
// как в игре: ушли со вкладки — тишина
document.addEventListener('visibilitychange', () => document.hidden ? Sound.pause() : Sound.resume());

load();
buildBar();
buildCards();
</script>
