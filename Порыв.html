<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Порыв</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik+Mono+One&family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Экраны: загрузка → карта островов → уровень. Уровень — диорама на весь экран, сверху стеклянная полоса,
   снизу (на ПК — справа) «журнал смотрителя»: фигуры и «Ветер!». Палитра: пасмурное небо, картонный остров, жёлтый штормовой флаг.
   Макет выбирается по форме окна (data-layout) и способу ввода (data-input), а не по типу устройства. */
:root {
  --bg: #dfe7ee; --sky1: #c6d3df; --sky2: #dfe7ee; --sky3: #f6f8fa;
  --panel: rgba(255, 255, 255, 0.76); --panel-solid: #ffffff; --line: rgba(30, 50, 75, 0.12);
  --ink: #17212c; --muted: #5a6979; --accent: #f7c21b; --accent-hi: #ffd23f; --accent-ink: #1c1600; --accent-deep: #b88a00;
  --ok: #23955e; --bad: #d63b45; --fill: rgba(30, 50, 75, 0.06); --fill2: rgba(30, 50, 75, 0.11);
  --ground: #ece5d3; --ground2: #e2dac6; --slab: #314a66; --slab2: #26394f; --gridline: rgba(40, 52, 72, 0.13);
  --glass: #36506b; --paper: #f7f3ea; --paper-line: rgba(90, 70, 40, 0.14);
  --f-display: "Rubik Mono One", "Arial Black", system-ui, sans-serif;
  --f-body: "Golos Text", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --tap: 40px;
  --pad-t: max(10px, env(safe-area-inset-top, 0px)); --pad-b: max(10px, env(safe-area-inset-bottom, 0px));
  --pad-l: max(12px, env(safe-area-inset-left, 0px)); --pad-r: max(12px, env(safe-area-inset-right, 0px));
  color-scheme: light;
}
[data-input="touch"] { --tap: 46px; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; }
[hidden] { display: none !important; }
body {
  background-color: var(--bg);
  background-image: radial-gradient(120% 80% at 50% 38%, var(--sky3) 0%, var(--sky2) 38%, var(--sky1) 100%);
  color: var(--ink); font: 14px/1.35 var(--f-body);
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
}
#stage { position: fixed; inset: 0; }
canvas#c { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent-deep); outline-offset: 2px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
  -webkit-backdrop-filter: blur(14px) saturate(1.2); backdrop-filter: blur(14px) saturate(1.2); box-shadow: 0 8px 28px rgba(30, 50, 75, 0.14); }
.i { width: 20px; height: 20px; flex: none; display: block; }
.i.on { color: var(--accent); filter: drop-shadow(0 0 0.5px var(--accent-deep)); }
.i.off { color: rgba(30, 50, 75, 0.16); }
/* инструменты разработчика — только с ?dev в адресе */
body:not(.dev) .dev { display: none !important; }

/* кнопки */
.btn { min-height: var(--tap); display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line);
  background: var(--fill); color: var(--ink); font: 600 13px var(--f-body); border-radius: 10px; padding: 0 12px; cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--fill2); }
.btn.wide { width: 100%; }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn .i { width: 16px; height: 16px; }
.btn .ad { font: 500 10px var(--f-mono); color: var(--muted); background: var(--fill2); border-radius: 4px; padding: 2px 5px; }
.btn.go { background: var(--accent) linear-gradient(90deg, rgba(28, 22, 0, 0.16) calc(var(--p, 0) * 100%), transparent 0); color: var(--accent-ink);
  border-color: var(--accent); font: 400 15px var(--f-display); letter-spacing: 0.05em; padding: 0 22px; min-height: calc(var(--tap) + 6px); }
.btn.go:hover { background-color: var(--accent-hi); }
.btn.go.big { min-height: 66px; border-radius: 16px; justify-content: space-between; gap: 12px; padding: 0 22px; }
.btn.go.big .i { width: 26px; height: 26px; }
.cta-t { display: grid; text-align: left; line-height: 1.15; min-width: 0; }
.cta-t b { font: 400 21px var(--f-display); letter-spacing: 0.05em; }
.cta-t small { font: 600 13px var(--f-body); letter-spacing: 0; opacity: 0.75; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kbd { font: 500 10px var(--f-mono); color: inherit; opacity: 0.6; border: 1px solid currentColor; border-radius: 4px; padding: 0 4px; line-height: 15px; }
[data-input="touch"] .kbd { display: none; }
.rbtn { width: var(--tap); height: var(--tap); flex: none; display: grid; place-items: center; border-radius: 50%; padding: 0; border: 1px solid var(--line); cursor: pointer;
  background: var(--panel); color: var(--ink); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); box-shadow: 0 4px 14px rgba(30, 50, 75, 0.14); }
.rbtn.dim { color: rgba(23, 33, 44, 0.35); }
.chip { height: var(--tap); display: inline-flex; align-items: center; gap: 5px; padding: 0 12px 0 9px; border-radius: 999px; border: 1px solid var(--line); cursor: pointer;
  background: var(--panel); color: var(--ink); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); box-shadow: 0 4px 14px rgba(30, 50, 75, 0.14); }
.chip b { font: 500 15px var(--f-mono); font-variant-numeric: tabular-nums; }
.chip span { font: 500 11px var(--f-mono); color: var(--muted); }
.tog, .seg button { min-height: calc(var(--tap) - 8px); border: 1px solid var(--line); background: var(--fill); border-radius: 8px; font: 600 12px var(--f-body); color: var(--ink); padding: 0 12px; cursor: pointer; }
.tog[aria-pressed="true"], .seg button[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
.seg { display: inline-flex; flex-wrap: wrap; gap: 4px; }
.ch { font: 500 10px var(--f-mono); color: var(--muted); text-transform: uppercase; letter-spacing: 0.07em; }
.meter { height: 8px; border-radius: 4px; background: var(--fill2); overflow: hidden; }
.meter span { display: block; height: 100%; width: calc(var(--p) * 100%); background: var(--accent); border-radius: 4px; }
.srow { display: inline-flex; gap: 1px; }
.srow .i { width: 14px; height: 14px; }
.ava { --s: 44px; width: var(--s); height: var(--s); flex: none; display: block; border-radius: 50%; overflow: hidden; box-shadow: 0 0 0 2px var(--ring, var(--accent)); background: #fff; }
.ava svg { display: block; width: 100%; height: 100%; }
.ava.big { --s: 56px; }
.ava.sm { --s: 30px; box-shadow: 0 0 0 1.5px var(--ring, var(--accent)); }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(247, 194, 27, 0.75); } 50% { box-shadow: 0 0 0 9px rgba(247, 194, 27, 0); } }
.pulse { animation: pulse 1.4s ease-in-out infinite; }

/* ===== уровень ===== */
.hud { position: fixed; inset: 0; pointer-events: none; }
.hud button, .hud .card, .hud input, .hud .pe { pointer-events: auto; }
.ctop { position: absolute; top: var(--pad-t); left: var(--pad-l); right: calc(var(--jw) + 12px); display: grid; gap: 8px; pointer-events: none; }
.hud { --jw: 340px; }
.topbar { padding: 8px 12px 8px 8px; display: grid; gap: 4px 12px; align-items: center;
  grid-template-columns: auto minmax(0, 1fr) auto; grid-template-areas: "menu lvl wind" "menu hint legend"; }
.topbar .fbtn { grid-area: menu; align-self: start; border-radius: 12px; box-shadow: none; background: var(--fill); }
.lvl { grid-area: lvl; display: grid; gap: 1px; min-width: 0; }
.lvl b { font: 400 14px/1.15 var(--f-display); letter-spacing: 0.03em; }
.wind-n { grid-area: wind; justify-self: end; display: flex; align-items: baseline; gap: 5px; }
.wind-n b { font: 500 20px var(--f-mono); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.wind-n .u { font-size: 12px; color: var(--muted); }
.arrow { display: inline-block; width: 18px; height: 18px; align-self: center; }
.arrow::before { content: ""; display: block; width: 100%; height: 100%; background: var(--ink); clip-path: polygon(0 40%, 58% 40%, 58% 16%, 100% 50%, 58% 84%, 58% 60%, 0 60%); }
.legend { grid-area: legend; width: 116px; align-self: start; font: 500 10px var(--f-mono); color: var(--muted); }
.legend .bar { height: 6px; border-radius: 3px; margin: 2px 0 3px; background: linear-gradient(90deg, #3d7fb8 0%, #46a9a6 21%, #9ccf5a 39%, #f0c93c 50%, #f08a3a 64%, #d8344c 79%, #9c2a8f 100%); }
.legend .ticks { display: flex; justify-content: space-between; font-variant-numeric: tabular-nums; }
.topbar .hint { grid-area: hint; margin: 0; font-size: 12px; color: var(--muted); text-wrap: pretty; }
.fbtn { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; padding: 0; border: 1px solid var(--line); cursor: pointer;
  background: var(--panel); color: var(--ink); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); box-shadow: 0 4px 14px rgba(30, 50, 75, 0.16); font: 600 18px var(--f-body); }
.fbtn svg { width: 22px; height: 22px; }
.fbtn:disabled { opacity: 0.4; cursor: default; }
.fcircles { justify-self: end; display: flex; align-items: flex-start; gap: 10px; }
.hintwrap { display: grid; justify-items: center; gap: 3px; }
.f-hint { width: 60px; height: 60px; font-size: 26px; background: var(--panel-solid); border: 2px solid var(--accent); }
.f-undo { margin-top: 8px; }
.f-cap { display: grid; justify-items: center; gap: 1px; font: 600 11px var(--f-body); color: var(--ink); background: var(--panel); border-radius: 8px; padding: 2px 6px 3px;
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
.f-cap .ad { font: 500 9px var(--f-mono); color: var(--muted); }

/* журнал смотрителя: справа на ПК, шторкой снизу на телефоне */
.journal { position: absolute; top: 0; right: 0; bottom: 0; width: var(--jw); display: flex; flex-direction: column; gap: 12px; pointer-events: auto; overflow: auto;
  padding: var(--pad-t) var(--pad-r) var(--pad-b) 18px; background-color: var(--paper);
  background-image: repeating-linear-gradient(180deg, transparent 0 27px, var(--paper-line) 27px 28px);
  border-left: 1px solid var(--paper-line); box-shadow: -10px 0 30px rgba(30, 50, 75, 0.12); }
.jl { display: flex; align-items: center; gap: 8px; font: 500 10px var(--f-mono); color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 4px; }
.jl::after { content: ""; flex: 1; border-top: 1px dashed var(--paper-line); }
.journal section { min-width: 0; }
.grip { display: none; }
.jhelp { margin: 6px 0 0; font-size: 12px; color: var(--muted); text-wrap: pretty; }
.jmeta { display: grid; gap: 6px; font-size: 12px; color: var(--muted); }
.jmeta:empty { display: none; }
.jmeta b { font-family: var(--f-mono); color: var(--ink); font-weight: 500; }
.tl { position: relative; }
.tl-bar { position: relative; height: 8px; border-radius: 4px; background: var(--fill2); overflow: hidden; }
.tl-gust { position: absolute; top: 0; bottom: 0; background: #f08a3a; }
.tl-shift { position: absolute; top: -1px; bottom: -1px; width: 3px; margin-left: -1px; background: #3d7fb8; }
.tl-cur { position: absolute; top: -3px; width: 2px; height: 14px; margin-left: -1px; background: var(--ink); }
.tl-lbl { display: flex; justify-content: space-between; font: 500 10px var(--f-mono); color: var(--muted); margin-top: 2px; }
.sandbox { display: grid; gap: 8px; font-size: 12px; color: var(--muted); }
.sandbox input[type=range] { width: 100%; accent-color: var(--accent); }
.sandbox b { font-family: var(--f-mono); color: var(--ink); }
.sandbox .row { display: flex; gap: 6px; }
.jacts { margin-top: auto; display: grid; }
.jacts .go { width: 100%; min-height: calc(var(--tap) + 12px); font-size: 17px; }

/* фигуры в запасе */
.inv { display: flex; flex-direction: column; gap: 6px; }
.piece { position: relative; display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; grid-template-areas: "ic nm cnt" "ic sp cnt"; align-items: center; column-gap: 8px;
  min-height: var(--tap); padding: 4px 10px 4px 4px; border-radius: 10px; border: 1px solid var(--paper-line); background: rgba(255, 255, 255, 0.75);
  color: var(--ink); font-family: var(--f-body); text-align: left; cursor: grab; touch-action: none; }
.piece:hover { background: #fff; }
.piece canvas { grid-area: ic; width: 44px; height: 40px; }
.piece .nm { grid-area: nm; font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; align-self: end; }
.piece .sp { grid-area: sp; font: 500 11px var(--f-mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.piece .cnt { grid-area: cnt; font: 500 14px var(--f-mono); color: var(--accent-deep); }
.piece[aria-pressed="true"] { background: #fff6d6; border-color: #d9a400; }
.piece:disabled { opacity: 0.4; cursor: default; }

/* реплики жителей и смотрителя */
.talk { padding: 12px; display: grid; gap: 10px; background: #fff; border: 1px solid var(--paper-line); border-left: 3px solid var(--accent); border-radius: 12px; }
.talk.win { border-left-color: var(--ok); }
.line { display: grid; grid-template-columns: 42px 1fr; gap: 10px; align-items: start; }
.line .ava { --s: 42px; }
.line .who { font: 600 13px var(--f-body); margin-right: 6px; }
.line .role { font-style: normal; font-size: 11px; color: var(--muted); }
.line p { margin: 2px 0 0; }
.acts { display: flex; justify-content: flex-end; align-items: center; gap: 12px; flex-wrap: wrap; }
.skip { background: none; border: 0; color: var(--muted); font: 500 12px var(--f-body); text-decoration: underline; cursor: pointer; min-height: var(--tap); padding: 0 4px; }

/* итог в журнале: поражение (поле остаётся видно — что и почему сломалось) */
.result { padding: 14px; display: grid; gap: 10px; background: #fff; border: 1px solid var(--paper-line); border-radius: 12px; }
.result h2 { margin: 0; font: 400 18px/1.1 var(--f-display); letter-spacing: 0.03em; }
.result.lose h2 { color: var(--bad); }
.result p { margin: 0; font-size: 13px; }
.result .why { color: var(--bad); font-weight: 600; }
.res-acts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.res-acts .go { grid-column: 1 / -1; }

/* кнопки у выделенной фигуры: повернуть, перенести (зажми и тяни), поставить */
.chips { position: absolute; z-index: 15; display: flex; gap: 8px; pointer-events: auto; }
.chips button { width: var(--tap); height: var(--tap); border-radius: 50%; border: 1px solid var(--line); background: var(--panel-solid); color: var(--ink);
  display: grid; place-items: center; padding: 0; cursor: pointer; box-shadow: 0 4px 14px rgba(30, 50, 75, 0.22); touch-action: none; }
.chips svg { width: 22px; height: 22px; }
.chips .c-rot { background: var(--accent); border-color: var(--accent-deep); color: var(--accent-ink); }
.chips .c-move { cursor: grab; }
.chips .c-ok { background: var(--ok); border-color: #1b7a4c; color: #fff; }
.chips .c-ok[aria-disabled="true"] { background: #d9dde2; border-color: var(--line); color: #9aa3ad; box-shadow: none; }
/* корзина — пока тащишь поставленную фигуру */
.trash { position: absolute; z-index: 30; left: 0; top: 0; width: 68px; height: 68px; border-radius: 50%; display: grid; place-items: center; align-content: center; gap: 1px;
  background: rgba(23, 33, 44, 0.86); color: #fff; font: 600 10px var(--f-body); box-shadow: 0 8px 24px rgba(23, 33, 44, 0.35);
  pointer-events: none; opacity: 0; transform: translateY(18px) scale(0.7); transition: opacity 0.15s, transform 0.15s, background 0.15s; }
.trash svg { width: 26px; height: 26px; }
.dragging-move .trash { opacity: 1; transform: none; }
.trash.hot { background: var(--bad); transform: scale(1.18); }
/* иконка, которая едет за пальцем над панелью */
.drag-icon { position: fixed; z-index: 65; left: 0; top: 0; width: 60px; height: 60px; border-radius: 14px; background: rgba(255, 255, 255, 0.92);
  box-shadow: 0 10px 26px rgba(23, 33, 44, 0.3); display: grid; place-items: center; pointer-events: none; opacity: 0; transition: opacity 0.12s; }
.drag-icon canvas { width: 50px; height: 46px; }
.dragging .drag-icon { opacity: 1; }
.dragging .drag-icon.on-board { opacity: 0; }

/* низкое окно (телефон горизонтально, VK на ПК): полоса в одну строку, журнал уже */
[data-layout="short"] .hud { --jw: 300px; }
[data-layout="short"] .topbar { grid-template-columns: auto auto minmax(0, 1fr) auto; grid-template-areas: "menu lvl hint wind"; padding: 5px 10px 5px 5px; }
[data-layout="short"] .legend { display: none; }
[data-layout="short"] .topbar .hint { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
[data-layout="short"] .lvl .ch { display: none; }
[data-layout="short"] .f-hint { width: 50px; height: 50px; font-size: 22px; }
[data-layout="short"] .fcircles { position: absolute; right: 0; top: calc(100% + 8px); }
[data-layout="short"] .journal { gap: 8px; padding-left: 14px; }
[data-layout="short"] .inv { display: grid; grid-template-columns: 1fr 1fr; }
[data-layout="short"] .piece { grid-template-columns: 36px minmax(0, 1fr); grid-template-areas: "ic nm" "ic sp"; padding: 3px 26px 3px 3px; }
[data-layout="short"] .piece canvas { width: 36px; height: 32px; }
[data-layout="short"] .piece .cnt { position: absolute; top: 3px; right: 6px; font-size: 11px; }
[data-layout="short"] .piece .sp { font-size: 10px; }
[data-layout="short"] .jacts .go { min-height: var(--tap); }
/* телефон вертикально: полоса на всю ширину сверху, журнал — шторка снизу */
[data-layout="portrait"] .ctop { right: var(--pad-r); }
[data-layout="portrait"] .journal { top: auto; left: 0; width: auto; max-height: 58%; border-left: 0; border-top: 1px solid var(--paper-line); border-radius: 18px 18px 0 0;
  padding: 6px var(--pad-r) var(--pad-b) var(--pad-l); gap: 10px; box-shadow: 0 -10px 30px rgba(30, 50, 75, 0.14); }
[data-layout="portrait"] .grip { display: block; align-self: center; flex: none; width: 40px; height: 4px; border-radius: 2px; background: var(--paper-line); }
[data-layout="portrait"] .jinv .jl { display: none; }
[data-layout="portrait"] .inv { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
[data-layout="portrait"] .piece { grid-template-columns: 1fr; grid-template-areas: "ic" "nm" "sp"; justify-items: center; text-align: center; padding: 6px 2px; row-gap: 1px; }
[data-layout="portrait"] .piece .nm { font-size: 12px; max-width: 100%; }
[data-layout="portrait"] .piece .sp { font-size: 10px; max-width: 100%; }
[data-layout="portrait"] .piece .cnt { position: absolute; top: 4px; right: 6px; font-size: 12px; }
[data-layout="portrait"] .jacts { margin-top: 0; }
/* больше четырёх фигур — без прокрутки (Яндекс, п. 1.10.4): сеткой, плитка «иконка слева, подписи справа» */
.inv[data-many] .piece { grid-template-columns: 34px minmax(0, 1fr); grid-template-areas: "ic nm" "ic sp"; padding: 4px 22px 4px 3px; text-align: left; justify-items: start; }
.inv[data-many] .piece canvas { width: 34px; height: 30px; }
.inv[data-many] .piece .cnt { position: absolute; top: 3px; right: 5px; font-size: 11px; }
.inv[data-many] .piece .nm { font-size: 12px; }
.inv[data-many] .piece .sp { font-size: 10px; }
[data-layout="portrait"] .inv[data-many] { grid-template-columns: repeat(3, minmax(0, 1fr)); }
[data-layout="wide"] .inv[data-many] { display: grid; grid-template-columns: 1fr 1fr; }

/* пауза: поле под размытием, время стоит */
.pause { position: fixed; inset: 0; z-index: 45; display: grid; place-items: center; padding: var(--pad-t) var(--pad-r) var(--pad-b) var(--pad-l);
  background: rgba(23, 33, 44, 0.22); -webkit-backdrop-filter: blur(10px) saturate(0.9); backdrop-filter: blur(10px) saturate(0.9); }
.menu { padding: 14px; display: grid; gap: 8px; width: min(360px, 100%); max-height: 100%; overflow: auto; background: var(--panel-solid); box-shadow: 0 20px 60px rgba(23, 33, 44, 0.35); }
.m-head { display: flex; justify-content: space-between; align-items: center; font: 400 14px var(--f-display); }
.m-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 13px; min-height: var(--tap); }
.m-row > span:first-child { font-weight: 600; }
.m-sep { border-top: 1px dashed var(--line); margin: 2px 0; }
.toast { position: fixed; z-index: 90; left: 50%; top: calc(var(--pad-t) + 8px); transform: translateX(-50%); max-width: min(420px, calc(100% - 32px));
  background: var(--ink); color: #fff; font-size: 13px; padding: 9px 14px; border-radius: 10px; box-shadow: 0 8px 24px rgba(23, 33, 44, 0.3); text-align: center; pointer-events: none; }

/* ===== карта островов ===== */
#map { --mcol: 520px; position: fixed; inset: 0; z-index: 20; background: linear-gradient(180deg, #a9bccd 0%, #c3d3e0 30%, #d3e0ea 100%); } /* --mcol — общая ширина шапки, карточки острова и «Играть» */
#map > svg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; /* место между панелями задаёт mapFrame(); края море растворяет в фоне */
  -webkit-mask-image: linear-gradient(180deg, transparent, #000 36px, #000 calc(100% - 36px), transparent); mask-image: linear-gradient(180deg, transparent, #000 36px, #000 calc(100% - 36px), transparent); }
.mov { position: absolute; inset: 0; pointer-events: none; }
.mov > * { pointer-events: auto; }
.plate { cursor: pointer; }
.plate:hover .ptop { filter: brightness(1.04); }
.dots circle { transition: opacity 0.3s; }
.zoomed .dots { opacity: 0; }
.dots .cur { animation: blink 1.4s ease-in-out infinite; }
@keyframes blink { 50% { stroke-width: 6; } }
.bolt { animation: flash 5s infinite; }
@keyframes flash { 0%, 88%, 100% { opacity: 0.25; } 90%, 94% { opacity: 1; } 92% { opacity: 0.4; } }
.spin { animation: spin 4s linear infinite; transform-box: fill-box; transform-origin: 50% 50%; }
@keyframes spin { to { transform: rotate(360deg); } }
.mtop-w { position: absolute; left: 0; right: 0; top: 0; z-index: 10; padding: var(--pad-t) var(--pad-r) 0 var(--pad-l); pointer-events: none; display: grid; gap: 8px; justify-items: center; }
.mtop { display: flex; align-items: center; gap: 8px; pointer-events: auto; width: 100%; max-width: var(--mcol); padding: 4px 14px 0; } /* отступ — как у содержимого карточки под ней */
.brand { display: grid; line-height: 1.1; margin-right: auto; min-width: 0; }
.brand b { font: 400 17px var(--f-display); letter-spacing: 0.04em; }
.brand span { font: 500 10px var(--f-mono); color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.plabel { position: absolute; transform: translate(-50%, -100%); display: flex; align-items: center; gap: 10px; padding: 8px 14px 8px 8px; border-radius: 14px; border: 0; cursor: pointer;
  background: #fff; color: var(--ink); font: inherit; text-align: left; box-shadow: 0 6px 18px rgba(30, 50, 75, 0.2); transition: opacity 0.25s; white-space: nowrap; }
.plabel .num { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; color: #fff; font: 400 16px var(--f-display); }
.plabel .t { display: grid; gap: 2px; line-height: 1.15; }
.plabel b { font: 400 16px var(--f-display); letter-spacing: 0.04em; }
.plabel small { font: 500 12px var(--f-mono); color: var(--muted); display: flex; align-items: center; gap: 3px; }
.plabel small .i { width: 13px; height: 13px; }
.plabel.shut { background: #39465a; color: #fff; }
.plabel.shut small { color: rgba(255, 255, 255, 0.75); }
.plabel.here::after { content: "ты здесь"; position: absolute; left: 50%; top: -18px; transform: translateX(-50%); font: 600 10px var(--f-mono); text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--accent-ink); background: var(--accent); padding: 1px 6px; border-radius: 4px; }
.zoomed .plabel { opacity: 0; pointer-events: none; }
/* кружок уровня */
.node { --d: 50px; position: absolute; width: var(--d); height: var(--d); margin: calc(var(--d) / -2) 0 0 calc(var(--d) / -2); border-radius: 50%; padding: 0; cursor: pointer;
  display: grid; place-items: center; border: 0; background: #fff; color: var(--ink); font: 500 16px var(--f-mono); font-variant-numeric: tabular-nums; transition: opacity 0.25s;
  box-shadow: 0 0 0 3px var(--cc, var(--accent)), 0 5px 0 0 rgba(30, 50, 75, 0.22), 0 8px 18px rgba(30, 50, 75, 0.18); }
.node .srow { position: absolute; left: 50%; bottom: -14px; transform: translateX(-50%); padding: 1px 4px; border-radius: 999px; background: #fff; box-shadow: 0 2px 6px rgba(30, 50, 75, 0.2); }
.node .srow .i { width: 13px; height: 13px; }
.node .bdg { position: absolute; right: -5px; top: -5px; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--ink); color: #fff; box-shadow: 0 0 0 2px #fff; }
.node .bdg .i { width: 13px; height: 13px; }
.node .bdg.k-new { background: var(--accent); color: var(--accent-ink); }
.node .who { position: absolute; left: -12px; top: -12px; }
.node .who .ava { box-shadow: 0 0 0 2px #fff; }
.node.locked { background: #e6eaee; color: rgba(23, 33, 44, 0.35); box-shadow: 0 0 0 3px rgba(30, 50, 75, 0.12), 0 4px 0 0 rgba(30, 50, 75, 0.12); }
.node.locked > .i { width: 18px; height: 18px; color: rgba(23, 33, 44, 0.3); }
.node.current { --d: 62px; background: var(--accent); color: var(--accent-ink); font-size: 21px; box-shadow: 0 0 0 4px #fff, 0 0 0 7px var(--accent-deep), 0 7px 0 3px rgba(150, 110, 0, 0.35), 0 12px 26px rgba(150, 110, 0, 0.35); }
.node.current::after { content: ""; position: absolute; inset: -12px; border-radius: 50%; border: 3px solid var(--accent); animation: ring 1.8s ease-out infinite; pointer-events: none; }
.node.boss { --d: 56px; }
.node.boss.current { --d: 66px; }
.node.hide { opacity: 0; pointer-events: none; }
.node.fresh { animation: pop 0.6s ease-out; }
@keyframes ring { 0% { transform: scale(0.85); opacity: 0.9; } 100% { transform: scale(1.3); opacity: 0; } }
@keyframes pop { 0% { transform: scale(0.6); } 60% { transform: scale(1.15); } 100% { transform: scale(1); } }
/* большие стрелки при наезде: к следующему острову и назад ко всей карте */
.navb { position: absolute; z-index: 4; display: grid; justify-items: center; gap: 4px; transform: translate(-50%, -50%); background: none; border: 0; padding: 0; cursor: pointer; color: var(--ink); }
.navb .disc { width: 68px; height: 68px; border-radius: 50%; display: grid; place-items: center; background: var(--panel-solid); box-shadow: 0 8px 22px rgba(30, 50, 75, 0.28); border: 3px solid var(--cc, var(--accent)); }
.navb .disc .i { width: 34px; height: 34px; transition: transform 0.2s; }
.navb.shut .disc { border-color: rgba(30, 50, 75, 0.25); color: var(--muted); }
.navb .cap { font: 600 12px var(--f-body); background: var(--panel-solid); border-radius: 8px; padding: 2px 8px; box-shadow: 0 3px 10px rgba(30, 50, 75, 0.16); white-space: nowrap; display: flex; align-items: center; gap: 4px; }
.navb .cap .i { width: 13px; height: 13px; }
/* «Все острова» — тёмная плашка в строку, чтобы не путать с белыми кружками уровней */
.navb.back { grid-auto-flow: column; align-items: center; gap: 8px; height: 48px; padding: 0 18px 0 8px; border-radius: 999px; background: var(--ink); color: #fff; box-shadow: 0 8px 22px rgba(23, 33, 44, 0.35); }
.navb.back .disc { width: 32px; height: 32px; border: 0; background: rgba(255, 255, 255, 0.16); box-shadow: none; }
.navb.back .disc .i { width: 20px; height: 20px; }
.navb.back .cap { font-size: 14px; padding: 0; background: none; box-shadow: none; }
.idots { position: absolute; z-index: 4; display: grid; gap: 9px; transform: translate(-50%, -50%); }
.idot { position: relative; width: 12px; height: 12px; border-radius: 50%; padding: 0; border: 2px solid #fff; background: rgba(30, 50, 75, 0.28); box-shadow: 0 2px 6px rgba(30, 50, 75, 0.25); cursor: pointer; }
.idot::before { content: ''; position: absolute; width: 32px; height: 32px; margin: -12px 0 0 -12px; } /* палец промахивается */
.idot.on { background: var(--cc); transform: scale(1.35); }
.idot.shut { opacity: 0.5; }
#map { touch-action: none; }
/* карточка главы при наезде */
.zcard { pointer-events: auto; width: min(100%, var(--mcol)); padding: 10px 14px 12px; border-radius: 18px; display: grid; gap: 10px; border-top: 4px solid var(--cc); background: var(--panel-solid); }
.zc-t { display: grid; gap: 1px; min-width: 0; }
.zc-t b { font: 400 22px/1.1 var(--f-display); letter-spacing: 0.03em; }
.zc-t small { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.zc-stats { display: grid; grid-template-columns: 1.4fr 1fr; gap: 8px; }
.zc-s { display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 5px; row-gap: 6px; padding: 8px 10px; border-radius: 12px; background: var(--fill); }
.zc-s b { font: 500 22px/1 var(--f-mono); font-variant-numeric: tabular-nums; }
.zc-s span { font-size: 12px; color: var(--muted); }
.zc-s .i { width: 18px; height: 18px; align-self: center; }
.zc-s .meter { flex: 1 0 100%; height: 6px; }
.zc-foot { display: flex; align-items: center; gap: 10px; min-width: 0; }
.zc-foot .folk { display: flex; flex: none; }
.zc-foot .folk .ava { margin-left: -5px; box-shadow: 0 0 0 2px #fff; }
.zc-foot .folk .ava:first-child { margin-left: 0; }
.zc-new { display: flex; align-items: center; gap: 5px; min-width: 0; font: 600 12px var(--f-body); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.zc-new .i { width: 14px; height: 14px; color: var(--accent-deep); flex: none; }
.mbottom { position: absolute; left: 0; right: 0; bottom: 0; z-index: 10; display: flex; justify-content: center; padding: 0 var(--pad-r) var(--pad-b) var(--pad-l); pointer-events: none; }
.mbottom .btn.go.big.cta { pointer-events: auto; flex: 0 1 var(--mcol); justify-content: flex-start; min-height: 78px; border-radius: 20px; gap: 14px; padding: 0 24px; box-shadow: 0 10px 28px rgba(150, 110, 0, 0.32); }
.mbottom .cta .i { width: 32px; height: 32px; }
.mbottom .cta .cta-t b { font-size: 26px; }
.mbottom .cta .cta-t small { font-size: 14px; }
[data-layout="short"] .zcard { position: absolute; left: var(--pad-l); top: calc(var(--pad-t) + 54px); width: 290px; gap: 8px; padding: 8px 10px 10px; }
[data-layout="short"] .mtop { max-width: none; } /* название — над карточкой слева */
[data-layout="short"] .zc-t b { font-size: 18px; }
[data-layout="short"] .zc-s { padding: 6px 8px; }
[data-layout="short"] .zc-s b { font-size: 18px; }
[data-layout="short"] .mbottom { justify-content: flex-end; }
[data-layout="short"] .mbottom .cta { flex: 0 0 auto; min-height: 64px; }
[data-layout="short"] .mbottom .cta .cta-t b { font-size: 21px; }
[data-layout="short"] .zoomed .mbottom { left: var(--pad-l); right: auto; width: 290px; padding: 0 0 var(--pad-b); }
[data-layout="short"] .zoomed .mbottom .cta { flex: 1; }
[data-layout="short"] .navb:not(.back) .disc { width: 56px; height: 56px; }

/* карточка уровня и ворот главы — снизу на телефоне, по центру на широком окне */
.sheet-wrap { position: fixed; inset: 0; z-index: 50; display: grid; align-items: end; justify-items: center; background: rgba(23, 33, 44, 0.28); padding: var(--pad-t) var(--pad-r) 0 var(--pad-l); }
.sheet { position: relative; width: min(420px, 100%); max-height: calc(100% - 12px); overflow: auto; background: var(--panel-solid); border-radius: 18px 18px 0 0;
  padding: 18px 18px calc(var(--pad-b) + 8px); box-shadow: 0 -10px 40px rgba(23, 33, 44, 0.25); animation: up 0.2s ease-out; }
@keyframes up { from { transform: translateY(30px); opacity: 0; } }
@media (min-width: 640px) and (min-height: 520px) { .sheet-wrap { align-items: center; padding-bottom: var(--pad-b); } .sheet { border-radius: 18px; padding-bottom: 18px; } }
.sh-x { position: absolute; right: 8px; top: 8px; width: 40px; height: 40px; border: 0; background: none; border-radius: 50%; cursor: pointer; color: var(--muted); display: grid; place-items: center; }
.sh-x:hover { background: var(--fill); }
.lc { display: grid; gap: 12px; }
.lc h2 { margin: 0; font: 400 19px/1.15 var(--f-display); letter-spacing: 0.03em; text-wrap: balance; padding-right: 30px; }
.lc-head { display: flex; gap: 12px; align-items: center; }
.lc-head > div { display: grid; gap: 3px; min-width: 0; }
.lc-say { margin: 0; padding: 10px 12px; background: var(--paper); border-left: 3px solid var(--accent); border-radius: 0 10px 10px 0; }
.lc-say p { margin: 0; font-size: 14px; text-wrap: pretty; }
.lc-say cite { display: block; margin-top: 4px; font: 500 11px var(--f-mono); color: var(--muted); font-style: normal; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { display: inline-flex; align-items: center; gap: 5px; padding: 4px 9px 4px 7px; border-radius: 999px; background: var(--fill); font: 600 12px var(--f-body); }
.tag .i { width: 15px; height: 15px; color: var(--accent-deep); }
.crit { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.crit li { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 13px; }
.crit li.on { color: var(--ink); }
.crit li .i { width: 18px; height: 18px; }
.lc .btn.go { width: 100%; }
.lock-why { margin: 0; display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 13px; }
.lock-why .i { width: 16px; height: 16px; }
.gate-ico { width: 56px; height: 56px; flex: none; border-radius: 50%; display: grid; place-items: center; background: var(--fill2); color: var(--muted); }
.gate-ico .i { width: 26px; height: 26px; }
.retry { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
.rt { display: grid; justify-items: start; gap: 2px; padding: 8px 10px; min-height: var(--tap); border-radius: 10px; border: 1px solid var(--line); background: var(--fill); cursor: pointer; font: 600 12px var(--f-body); color: var(--ink); text-align: left; }

/* ===== окна: итог уровня, новая глава ===== */
.win-wrap { position: fixed; inset: 0; z-index: 52; display: grid; place-items: center; padding: var(--pad-t) var(--pad-r) var(--pad-b) var(--pad-l);
  background: rgba(23, 33, 44, 0.42); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.win { width: min(420px, 100%); max-height: 100%; overflow: auto; background: var(--panel-solid); border-radius: 22px; padding: 14px 18px 18px; display: grid; gap: 14px;
  box-shadow: 0 20px 60px rgba(23, 33, 44, 0.35); animation: winIn 0.28s ease-out; }
@keyframes winIn { from { transform: translateY(16px) scale(0.97); opacity: 0; } }
.w-a { display: grid; justify-items: center; text-align: center; gap: 4px; }
.w-art { width: 100%; max-width: 300px; height: auto; background: radial-gradient(ellipse at 50% 45%, #e3ecf3 0%, rgba(227, 236, 243, 0) 70%); }
.w-a h2 { margin: 0; font: 400 26px/1.1 var(--f-display); letter-spacing: 0.03em; }
.w-chap .w-a h2 { font-size: 30px; }
.w-place { margin: 0; color: var(--muted); }
.w-b { display: grid; gap: 12px; }
.bigstars { display: flex; align-items: flex-end; gap: 6px; margin-top: 6px; }
.bs { width: 54px; height: 54px; color: rgba(30, 50, 75, 0.14); }
.bs:nth-child(2) { width: 68px; height: 68px; margin-bottom: 8px; }
.bs .i { width: 100%; height: 100%; }
.bs.on { color: var(--accent); filter: drop-shadow(0 2px 0 var(--accent-deep)); animation: starIn 0.45s cubic-bezier(0.3, 1.6, 0.5, 1) both; }
@keyframes starIn { from { transform: scale(0) rotate(-40deg); opacity: 0; } }
.w-load { margin: 0; font-size: 13px; color: var(--muted); }
.w-load b { font-family: var(--f-mono); color: var(--ink); font-weight: 500; }
.w-best { display: flex; gap: 6px; align-items: center; color: var(--ink); }
.w-best .i { width: 16px; height: 16px; color: var(--accent); flex: none; }
.w-say { display: grid; grid-template-columns: 44px 1fr; gap: 10px; align-items: start; background: var(--paper); border-radius: 12px; padding: 10px 12px; }
.w-say p { margin: 0; font-size: 14px; text-wrap: pretty; }
.w-say cite { display: block; margin-top: 3px; font: 500 11px var(--f-mono); color: var(--muted); font-style: normal; }
.w-prog { display: grid; gap: 6px; font-size: 13px; }
.w-prog > span { display: flex; align-items: center; gap: 4px; color: var(--muted); }
.w-prog b { font: 500 16px var(--f-mono); color: var(--ink); }
.w-prog em { font: 600 12px var(--f-mono); font-style: normal; color: var(--ok); background: rgba(35, 149, 94, 0.12); border-radius: 6px; padding: 1px 5px; margin-left: 4px; }
.w-prog .grow { flex: 1; }
.w-prog .i { width: 16px; height: 16px; }
.w-prog.open { display: flex; align-items: center; gap: 8px; background: #fff6d6; border: 1px solid #e8c34a; border-radius: 12px; padding: 10px 12px; }
.w-prog.open .i { color: var(--accent-deep); width: 20px; height: 20px; }
.w-prog.open b { font: 600 14px var(--f-body); }
.w-row { display: grid; gap: 6px; }
.w-row .folk { display: flex; gap: 8px; }
.w-acts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.w-acts .go.big { grid-column: 1 / -1; }
.fog-off { animation: fogOff 1.6s 0.3s ease-in both; }
@keyframes fogOff { to { transform: translateX(-30px); opacity: 0; } }
.storm-off { animation: stormOff 2s 0.2s ease-in both; }
@keyframes stormOff { to { transform: translate(80px, -20px); opacity: 0; } }
.gust path { animation: gust 1.6s linear infinite; }
@keyframes gust { 0% { transform: translateX(-30px); opacity: 0; } 30% { opacity: 1; } 100% { transform: translateX(90px); opacity: 0; } }
[data-layout="short"] .win { width: min(760px, 100%); grid-template-columns: 1fr 1.15fr; align-items: center; column-gap: 20px; padding: 12px 18px; }
[data-layout="short"] .w-art { max-width: 240px; }
[data-layout="short"] .w-a h2 { font-size: 22px; }
[data-layout="short"] .bs { width: 42px; height: 42px; }
[data-layout="short"] .bs:nth-child(2) { width: 52px; height: 52px; }
[data-layout="short"] .w-b { gap: 9px; }
[data-layout="short"] .btn.go.big { min-height: 56px; }

/* загрузка: нажать ничего нельзя; по готовности сразу игра, без затемнения (Яндекс 1.19) */
.load { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; padding: var(--pad-t) var(--pad-r) var(--pad-b) var(--pad-l); cursor: progress;
  background-color: var(--bg); background-image: radial-gradient(120% 80% at 50% 38%, var(--sky3) 0%, var(--sky2) 38%, var(--sky1) 100%); }
.l-in { width: min(360px, 100%); display: grid; justify-items: center; text-align: center; gap: 6px; }
.l-art { width: 100%; max-width: 320px; height: auto; }
.load h1 { margin: 4px 0 0; font: 400 40px/1 var(--f-display); letter-spacing: 0.06em; }
.l-sub { margin: 0 0 14px; font: 500 12px var(--f-mono); color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; }
.lbar { width: 100%; height: 10px; border-radius: 5px; background: rgba(30, 50, 75, 0.12); overflow: hidden; }
.lbar span { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 5px; }
.l-pc { margin: 0; font: 500 12px var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.l-tip { margin: 8px 0 0; font-size: 14px; min-height: 2.7em; text-wrap: balance; }
.l-flag { transform-box: fill-box; transform-origin: 0 50%; animation: flag 0.5s ease-in-out infinite alternate; }
@keyframes flag { to { transform: skewY(6deg) scaleX(0.92); } }
[data-layout="short"] .l-in { width: min(640px, 100%); grid-template-columns: 1fr 1fr; align-items: center; column-gap: 24px; }
[data-layout="short"] .l-art { grid-row: 1 / span 6; }
[data-layout="short"] .l-in > :not(.l-art) { grid-column: 2; }
@media (prefers-reduced-motion: reduce) {
  .pulse, .node.current::after, .node.fresh, .dots .cur, .bolt, .spin, .win, .bs.on, .fog-off, .storm-off, .gust path, .l-flag, .sheet { animation: none; }
  .fog-off, .storm-off { opacity: 0; }
}
</style>

<body>
<div id="stage"><canvas id="c"></canvas></div>

<!-- уровень -->
<div class="hud" id="hud" hidden>
  <div class="ctop" id="ctop">
    <div class="topbar card" id="topbar">
      <button class="fbtn" type="button" id="menuBtn" aria-label="Меню и пауза"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <div class="lvl"><span class="ch" id="lvCh"></span><b id="lvName"></b></div>
      <div class="wind-n"><span class="arrow" id="windArrow" aria-hidden="true"></span><b id="windMs"></b><span class="u">м/с</span></div>
      <div class="legend" aria-label="Цвет поля — скорость ветра"><div class="bar"></div><div class="ticks"><span>0</span><span>14</span><span>28 м/с</span></div></div>
      <p class="hint" id="hint"></p>

<script>
// ===== Ядро ветра: упрощённый CFD (stable fluids, Jos Stam) =====
// Поле: доска bw×bh клеток, каждая клетка делится на S×S подъячеек, вокруг — поле запаса M клеток.
function createSim(bw, bh, S, M) {
  const nx = (bw + 2 * M) * S, ny = (bh + 2 * M) * S, N = nx * ny;
  const sim = {
    bw, bh, S, M, nx, ny, N,
    u: new Float32Array(N), v: new Float32Array(N),
    u0: new Float32Array(N), v0: new Float32Array(N),
    p: new Float32Array(N), div: new Float32Array(N), curl: new Float32Array(N),
    solid: new Uint8Array(N), drag: new Float32Array(N),
    over: new Float32Array(N),  // «перелёт» ветра через низкие дома: подкачка набегающего потока за пределом тени
    boost: new Float32Array(N), // «сдув вниз» у подножия высоток: ускорение у боковых стен
    W: 10,            // скорость набегающего потока в подъячейках/с
    vort: 0,        // vorticity confinement — «аркадные» вихри
    iters: 40,
    t: 0,
  };
  return sim;
}

function simReset(s, dir) {
  for (let k = 0; k < s.N; k++) {
    s.u[k] = s.solid[k] ? 0 : dir[0] * s.W;
    s.v[k] = s.solid[k] ? 0 : dir[1] * s.W;
    s.p[k] = 0;
  }
  s.t = 0;
}

// клетка доски → индекс первой подъячейки
function subIndex(s, cx, cy, a, b) {
  return ((cy + s.M) * s.S + b) * s.nx + (cx + s.M) * s.S + a;
}

function sample(s, f, x, y) {
  const nx = s.nx, ny = s.ny;
  if (x < 0) x = 0; if (y < 0) y = 0;
  if (x > nx - 1.001) x = nx - 1.001; if (y > ny - 1.001) y = ny - 1.001;
  const i = x | 0, j = y | 0, fx = x - i, fy = y - j, k = j * nx + i;
  return (f[k] * (1 - fx) + f[k + 1] * fx) * (1 - fy) + (f[k + nx] * (1 - fx) + f[k + nx + 1] * fx) * fy;
}

// windVec: [wx, wy] в подъячейках/с (уже с порывами)
function simStep(s, dt, windVec, dir) {
  const { nx, ny, u, v, u0, v0, p, div, solid, drag, curl } = s;
  const W = s.W;
  // 1. «губка» на наветренной стороне держит набегающий поток,
  //    а за краями доски гасим обратный поток: иначе ветер затекает с подветренного края
  //    и без трения за 10–30 с раскручивает вихрь на пол-острова
  const sponge = s.M * s.S * 0.8, edge = s.M * s.S;
  for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) {
    let d;
    if (dir[0] > 0) d = i; else if (dir[0] < 0) d = nx - 1 - i; else if (dir[1] > 0) d = j; else d = ny - 1 - j;
    const k = j * nx + i;
    if (d < sponge) {
      const a = 0.35 * (1 - d / sponge);
      u[k] += (windVec[0] - u[k]) * a; v[k] += (windVec[1] - v[k]) * a;
    } else if (i < edge || j < edge || i >= nx - edge || j >= ny - edge) {
      const back = u[k] * dir[0] + v[k] * dir[1];
      if (back < 0) { u[k] -= back * dir[0] * 0.2; v[k] -= back * dir[1] * 0.2; }
    }
  }
  // 2. vorticity confinement
  if (s.vort > 0) {
    for (let j = 1; j < ny - 1; j++) for (let i = 1; i < nx - 1; i++) {
      const k = j * nx + i;
      curl[k] = 0.5 * ((v[k + 1] - v[k - 1]) - (u[k + nx] - u[k - nx]));
    }
    for (let j = 2; j < ny - 2; j++) for (let i = 2; i < nx - 2; i++) {
      const k = j * nx + i;
      if (solid[k]) continue;
      const gx = 0.5 * (Math.abs(curl[k + 1]) - Math.abs(curl[k - 1]));
      const gy = 0.5 * (Math.abs(curl[k + nx]) - Math.abs(curl[k - nx]));
      const l = Math.hypot(gx, gy) + 1e-5;
      const w = curl[k];
      u[k] += s.vort * (gy / l) * w * dt * 10;
      v[k] -= s.vort * (gx / l) * w * dt * 10;
    }
  }
  // 3. адвекция (полулагранжева)
  u0.set(u); v0.set(v);
  for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) {
    const k = j * nx + i;
    if (solid[k]) { u[k] = 0; v[k] = 0; continue; }
    const x = i - u0[k] * dt, y = j - v0[k] * dt;
    u[k] = sample(s, u0, x, y); v[k] = sample(s, v0, x, y);
  }
  // 4. сопротивление: деревья, ветряки (пористые зоны)
  for (let k = 0; k < s.N; k++) {
    if (drag[k] > 0) { const f = 1 - drag[k]; u[k] *= f; v[k] *= f; }
    if (s.over[k] > 0) { const a = s.over[k]; u[k] += (windVec[0] - u[k]) * a; v[k] += (windVec[1] - v[k]) * a; }
    if (s.boost[k] > 0 && u[k] * dir[0] + v[k] * dir[1] > 0.3 * W) {
      // подтягиваем скорость к (1 + boost)·W, без бесконечного разгона
      const sp = Math.hypot(u[k], v[k]), tgt = (1 + s.boost[k]) * W;
      if (sp < tgt) { const f = Math.min(1.03, tgt / sp); u[k] *= f; v[k] *= f; }
    }
  }
  // 5. проекция (несжимаемость), Гаусс–Зейдель с тёплым стартом
  for (let j = 1; j < ny - 1; j++) for (let i = 1; i < nx - 1; i++) {
    const k = j * nx + i;
    div[k] = solid[k] ? 0 : 0.5 * (u[k + 1] - u[k - 1] + v[k + nx] - v[k - nx]);
  }
  for (let it = 0; it < s.iters; it++) {
    for (let j = 1; j < ny - 1; j++) for (let i = 1; i < nx - 1; i++) {
      const k = j * nx + i;
      if (solid[k]) continue;
      const pc = p[k];
      const pl = solid[k - 1] ? pc : p[k - 1], pr = solid[k + 1] ? pc : p[k + 1];
      const pd = solid[k - nx] ? pc : p[k - nx], pu = solid[k + nx] ? pc : p[k + nx];
      p[k] = (pl + pr + pd + pu - div[k]) * 0.25;
    }
  }
  for (let j = 1; j < ny - 1; j++) for (let i = 1; i < nx - 1; i++) {
    const k = j * nx + i;
    if (solid[k]) continue;
    const pc = p[k];
    const pl = solid[k - 1] ? pc : p[k - 1], pr = solid[k + 1] ? pc : p[k + 1];
    const pd = solid[k - nx] ? pc : p[k - nx], pu = solid[k + nx] ? pc : p[k + nx];
    u[k] -= 0.5 * (pr - pl); v[k] -= 0.5 * (pu - pd);
    // ограничитель — защита от взрывов
    const sp = Math.hypot(u[k], v[k]), mx = W * 3;
    if (sp > mx) { u[k] *= mx / sp; v[k] *= mx / sp; }
  }
  // 6. границы: открытые
  for (let i = 0; i < nx; i++) {
    u[i] = u[i + nx]; v[i] = v[i + nx];
    const a = (ny - 1) * nx + i; u[a] = u[a - nx]; v[a] = v[a - nx];
  }
  for (let j = 0; j < ny; j++) {
    const a = j * nx; u[a] = u[a + 1]; v[a] = v[a + 1];
    const b = a + nx - 1; u[b] = u[b - 1]; v[b] = v[b - 1];
  }
  s.t += dt;
}

if (false) module.exports = { createSim, simReset, simStep, sample, subIndex };

  const mx = Math.min(...c.map(a => a[0])), my = Math.min(...c.map(a => a[1]));
  return c.map(([x, y]) => [x - mx, y - my]);

// самый нагруженный уцелевший дом за прогон: r — нагрузка / предел.
// Звёзды — только за дома, которые игрок защищает: высотки и башни (стоят ли они изначально или их ставят щитом) не считаются

// Мир: доска + симуляция + нагрузки
function createWorld() {
  const sim = createSim(BOARD, BOARD, SUB, MARGIN);
  const w = { sim, pieces: [], windMs: 18, dir: [1, 0], baseDir: [1, 0], mode: 'threshold', running: false, t: 0, gust: true };
  clearMods(w); return w;
}

function occupancy(world, except) {
  const occ = new Map();
  for (const pc of world.pieces) if (pc !== except && !pc.broken) for (const [x, y] of pieceCells(pc)) occ.set(x + ',' + y, pc);
  return occ;
}

  const occ = occupancy(world, except), roads = world.roads;
  const T = TYPES[pc.type];
  // дом-арка может стоять над дорогой: проезд (средняя клетка) — на дороге, крылья — по бокам от неё
  return pieceCells(pc).every(([x, y], i) => x >= 0 && y >= 0 && x < BOARD && y < BOARD && !occ.has(x + ',' + y)
    && !(roads && roads.has(x + ',' + y) && !(T.kind === 'arch' && i === 1)) && !(world.water && world.water.has(x + ',' + y)) && terrainAt(world, x, y) < 3
    && !(world.zone && T.kind === 'shed' && !world.zone.has(x + ',' + y)));
}
// дороги: ломаные по центрам клеток → набор занятых клеток
function roadCells(paths) {
  const set = new Set();
  for (const p of paths || []) for (let i = 1; i < p.length; i++) {
    let [x, y] = p[i - 1]; const [x1, y1] = p[i];
    const dx = Math.sign(x1 - x), dy = Math.sign(y1 - y);
    for (;;) { if (x >= 0 && y >= 0 && x < BOARD && y < BOARD) set.add(x + ',' + y); if (x === x1 && y === y1) break; x += dx; y += dy; }
  }
  return set;
}
function clearMods(world) {
  world.mods = {}; world.terrain = null; world.water = new Set(); world.zone = null;
  world.gusts = null; world.shift = null; world.duration = 8; world.target = 0; world.logs = 0;
}
function applyLevel(world, L) {
  clearMods(world);
  world.windMs = L.wind; world.dir = L.dir.slice(); world.baseDir = L.dir.slice();
  world.roadPaths = L.roads || []; world.roads = roadCells(world.roadPaths);
  world.pieces = L.fixed.map(p => ({ ...p, fixed: true, broken: false, load: 0, hp: 1 }));
  world.mods = { ...(L.mods || {}) };
  world.duration = L.duration || 8;
  world.gusts = L.gusts || null; world.shift = L.shift || null; world.target = L.target || 0;
  world.logs = L.logs || 0;
  if (L.terrain) {
    world.terrain = new Uint8Array(BOARD * BOARD);
    L.terrain.forEach((row, y) => [...row].forEach((ch, x) => {
      if (ch === 'w') world.water.add(x + ',' + y); else world.terrain[y * BOARD + x] = +ch;
    }));
  }
  if (L.forest) {
    const taken = new Set(); for (const p of world.pieces) for (const [x, y] of pieceCells(p)) taken.add(x + ',' + y);
    L.forest.forEach((row, y) => [...row].forEach((ch, x) => {
      if (ch === '1' && !taken.has(x + ',' + y)) world.pieces.push({ type: 'tree', x, y, rot: 0, fixed: true, cut: true, broken: false, load: 0, hp: 1 });
    }));

function terrainAt(world, x, y) { return world.terrain && x >= 0 && y >= 0 && x < BOARD && y < BOARD ? world.terrain[y * BOARD + x] : 0; }

// маски симуляции из построек
function rebuild(world) {
  const s = world.sim;
  s.solid.fill(0); s.drag.fill(0); s.over.fill(0); s.boost.fill(0);
  if (!s.owner) s.owner = new Int16Array(s.N);
  s.owner.fill(-1);
  const hmap = new Float32Array(s.N);
  // рельеф: скалы (3) — сплошные; холмы (1–2) — разгон ветра на вершине
  if (world.terrain) for (let cy = 0; cy < BOARD; cy++) for (let cx = 0; cx < BOARD; cx++) {
    const h = terrainAt(world, cx, cy); if (!h) continue;
    for (let b = 0; b < SUB; b++) for (let a = 0; a < SUB; a++) {
      const k = subIndex(s, cx, cy, a, b);
      if (h >= 3) { s.solid[k] = 1; hmap[k] = 2.2; } else s.boost[k] = HILL_BOOST * h;
    }
  }
  world.pieces.forEach((pc, idx) => { pc.idx = idx; });
  for (const pc of world.pieces) {
    if (pc.broken) continue;
    const T = TYPES[pc.type];
    pc.subs = [];
    if (T.kind === 'loose') continue;            // палатка не мешает ветру, пока лежит
    if (T.kind === 'gate' && pc.open) continue;   // открытые ворота — проход
    const cells = pieceCells(pc);
    const mid = cells[1];
    const N2 = 2 * SUB - 1;
    for (const [cx, cy] of cells) for (let b = 0; b < SUB; b++) for (let a = 0; a < SUB; a++) {
      const k = subIndex(s, cx, cy, a, b);
      const A = (cx - pc.x) * SUB + a, B = (cy - pc.y) * SUB + b; // координаты внутри фигуры
      if (T.kind === 'shed' && (a !== 1 && b !== 1)) continue; // круглое сечение: «плюс» из подъячеек
      if (T.kind === 'round') { const r = SUB, dx = A + 0.5 - r, dy = B + 0.5 - r; if (dx * dx + dy * dy > r * r) continue; }
      if (T.kind === 'wedge') {
        const r = pc.rot % 4, u = r === 1 || r === 2 ? N2 - A : A, v = r >= 2 ? N2 - B : B;
        if (u + v > N2) continue;
      }
      if (T.kind === 'arch' && cx === mid[0] && cy === mid[1]) continue; // проезд под аркой
      if (T.kind === 'wattle') {
        const horiz = pc.rot % 2 === 0;
        if (horiz ? b === 1 : a === 1) s.drag[k] = T.drag;
        continue;
      }
      if (T.kind === 'tree') { s.drag[k] = T.drag; continue; }
      if (T.kind === 'mill') { if (a === 1 && b === 1) { s.solid[k] = 1; } else s.drag[k] = T.drag; continue; }
      if (T.kind === 'fence') {
        // тонкая стенка по оси забора, через середину клетки
        const horiz = pc.rot % 2 === 0;
        const on = horiz ? b === 1 : a === 1;
        if (!on) continue;
      }
      s.solid[k] = 1; pc.subs.push(k); hmap[k] = T.h; s.owner[k] = pc.idx;
    }
  }
  // подветренная сторона холма: тихая зона длиной ~2 клетки на уровень высоты
  if (world.terrain) {
    const d = world.dir;
    for (let cy = 0; cy < BOARD; cy++) for (let cx = 0; cx < BOARD; cx++) {
      const th = terrainAt(world, cx, cy);
      let lee = 0;
      for (let n = 1; n <= 4; n++) {
        const hx = cx - d[0] * n, hy = cy - d[1] * n, hq = terrainAt(world, hx, hy);
        if (hq > th && hq < 3 && n <= 2 * (hq - th)) lee = Math.max(lee, (hq - th) * (1 - (n - 1) / (2 * (hq - th))));
      }
      if (lee > 0) for (let b = 0; b < SUB; b++) for (let a = 0; a < SUB; a++) {
        const k = subIndex(s, cx, cy, a, b); if (!s.solid[k]) s.drag[k] = Math.max(s.drag[k], LEE_DRAG * lee);
      }
    }
  }
  // Высота → длина ветровой тени. Идём от каждой воздушной подъячейки против ветра;
  // если ближайшее препятствие дальше, чем его тень (SHADOW_BASE + SHADOW_PER_H × высота),
  // ветер «перелетел» через крышу и снова набирает силу.
  const d = world.dir, step = -(d[1] * s.nx + d[0]), maxD = Math.ceil((SHADOW_BASE + SHADOW_PER_H * 3.4) * SUB);
  for (let j = 1; j < s.ny - 1; j++) for (let i = 1; i < s.nx - 1; i++) {
    const k = j * s.nx + i; if (s.solid[k]) continue;
    let q = k, ii = i, jj = j;
    // у самых стен подкачку не делаем, чтобы не ломать естественное обтекание
    let near = false;
    for (let dj = -2; dj <= 2 && !near; dj++) for (let di = -2; di <= 2; di++) { const q2 = k + dj * s.nx + di; if (q2 >= 0 && q2 < s.N && s.solid[q2]) { near = true; break; } }
    if (near) continue;
    for (let n = 1; n <= maxD; n++) {
      q += step; ii -= d[0]; jj -= d[1];
      if (ii < 0 || jj < 0 || ii >= s.nx || jj >= s.ny) break;
      if (s.solid[q]) {
        const shadow = (SHADOW_BASE + SHADOW_PER_H * hmap[q]) * SUB;
        if (n > shadow) s.over[k] = Math.min(1, (n - shadow) / SUB) * 0.08;
        break;
      }
    }
  }
  // кольцо соседних «воздушных» подъячеек вокруг каждой постройки
  for (const pc of world.pieces) {
    if (pc.broken || !pc.subs) continue;
    const ring = new Set();
    // только клетки, соседние по граням (без диагоналей): угловой завихрень не решает всё в одиночку
    for (const k of pc.subs) for (const q of [k - 1, k + 1, k - s.nx, k + s.nx]) if (!s.solid[q]) ring.add(q);
    pc.ring = [...ring];
    // сцепка: соседние по стене дома
    pc.adj = 0;
    if (TYPES[pc.type].tall) {
      // зона сдува: полоса на 2–4 подъячейки от стен высотки (не сами стены)
      // только с наветренной стороны и по бокам — за высоткой остаётся тень
      const along = (k) => (k % s.nx) * d[0] + ((k / s.nx) | 0) * d[1];
      let dmax = -1e9; for (const k of pc.subs) dmax = Math.max(dmax, along(k));
      for (const k of pc.subs) for (let dj = -4; dj <= 4; dj++) for (let di = -4; di <= 4; di++) {
        const m = Math.max(Math.abs(di), Math.abs(dj)); if (m < 2) continue;
        const q = k + dj * s.nx + di;
        if (q >= 0 && q < s.N && !s.solid[q] && along(q) <= dmax) s.boost[q] = DOWNWASH;
      }
    }
  }
}

// Срыв вихрей (дорожка Кармана): след за трубой «виляет» — поперечная волна бежит по ветру,

const SHED_AMP = 1.8;   // размах «виляния» следа, доля скорости ветра
const SHED_LEN = 5;       // длина вихревой дорожки, клеток
const SHED_HALF = 2.0;  // полуширина следа, клеток   // полуширина следа, клеток

  if (st.fz > 1.001) { const z = st.fz; ox = st.fp[0] + (ox - st.fp[0]) * z; oy = st.fp[1] + (oy - st.fp[1]) * z; tw *= z; }

  if (Math.abs(target - st.fz) > 1e-3) { st.fz += (target - st.fz) * Math.min(1, dt * 8); if (Math.abs(target - st.fz) < 2e-3) st.fz = target; }
  if (dragging && d.zoomed) {
    const [fx, fy] = local(d.cx, d.cy), px = d.off ? fx + d.off[0] : fx, py = d.off ? fy + d.off[1] : fy - d.lift, k = Math.min(1, dt * 10);

}

// ---------- подсказка и решение ----------
const sameSpot = (a, b) => a.type === b.type && (TYPES[a.type].kind !== 'wedge' || a.rot % 4 === b.rot % 4)
  && String(pieceCells(a).sort()) === String(pieceCells(b).sort());
function hintable() { if (st.sandbox) return false; const L = LEVELS[st.level]; return !st.tut && ((L.solution || []).length > 0 || !!L.gatePlan); }
// подсказка: одна фигура из проверенного решения встаёт на своё место, мешающие уходят в запас (позже — за рекламу, через platform/)
function giveHint() {
  if (!hintable()) return;
  agentNote('hint');
  if (st.phase === 'result') resetScene();
  if (st.phase !== 'build' || !tryCommit()) return;
  const L = LEVELS[st.level], before = snap();
  st.sel = null;
  if (!(L.solution || []).length) { st.autoGate = L.gatePlan; toast('Подсказка: ворота закроются сами по проверенному расписанию. Жми «Ветер!».'); updateUI(); return; }
  // какие фигуры игрока уже стоят по решению и какая из решения — следующая
  const mine = world.pieces.filter(p => !p.fixed), ok = new Set();
  let next = null;
  for (const s of L.solution) {
    const m = mine.find(p => !ok.has(p) && sameSpot(p, s));
    if (m) ok.add(m); else if (!next) next = s;
  }
  if (!next) { toast('Все фигуры уже на своих местах. Жми «Ветер!»'); return; }
  let moved = 0;
  const wrong = () => world.pieces.filter(p => !p.fixed && !ok.has(p));
  const toStash = pc => { world.pieces.splice(world.pieces.indexOf(pc), 1); returnToStash(pc); moved++; };
  const cells = new Set(pieceCells(next).map(String));
  for (const p of wrong()) if (pieceCells(p).some(c => cells.has(String(c)))) toStash(p);
  if (shopOf()) {
    // бревно: вернуть лишнюю фигуру или срубить дерево, которое рубят в решении
    const cuts = L.solutionCuts || [], isCut = (x, y) => cuts.some(c => c[0] === x && c[1] === y);
    const getLog = () => {
      const w = wrong()[0];
      if (w) { toStash(w); return true; }
      const t = world.pieces.find(p => p.cut && isCut(p.x, p.y));
      if (!t) return false;
      world.pieces.splice(world.pieces.indexOf(t), 1); st.stumps.push([t.x, t.y]); st.logs++; return true;
    };
    // деревья, срубленные зря, сажаем обратно
    for (const [x, y] of st.stumps.filter(([x, y]) => !isCut(x, y))) {
      while (st.logs < 1 && getLog());
      if (st.logs < 1 || pieceAt(x, y)) continue;
      st.stumps.splice(st.stumps.findIndex(s => s[0] === x && s[1] === y), 1); st.logs--;
      world.pieces.push({ type: 'tree', x, y, rot: 0, fixed: true, cut: true, broken: false, load: 0, hp: 1 });
    }
    while (st.logs < costOf(next.type) && getLog());
  } else if (!(st.inv[next.type] > 0)) {
    const w = wrong().find(p => p.type === next.type);
    if (w) toStash(w);
  }
  rebuild(world);
  if (placeAt(next.type, next.x, next.y, next.rot)) {
    toast(`Подсказка: ${TYPES[next.type].name.toLowerCase()} — на своём месте.` + (moved ? ' Мешавшие фигуры вернулись в запас.' : ''));
    st.selected = null; st.selBad = false;
  }
  record(before);
}
// проверенное решение уровня (для плейтеста, только с ?dev)
function showSolution() {
  if (st.sandbox || st.phase === 'run') return;
  const L = LEVELS[st.level];
  loadLevel(st.level, false);
  if (st.tut) { st.tut = null; st.inv = { ...L.inv }; buildInv(); }
  for (const [x, y] of L.solutionCuts || []) {
    const t = world.pieces.find(p => p.cut && p.x === x && p.y === y);
    if (t) { world.pieces.splice(world.pieces.indexOf(t), 1); st.stumps.push([x, y]); st.logs++; }
  }
  for (const p of L.solution || []) { world.pieces.push({ ...p, broken: false, load: 0, hp: 1 }); if (shopOf()) st.logs -= costOf(p.type); else st.inv[p.type]--; }
  st.autoGate = L.gatePlan || null;
  rebuild(world); setPause(false);
  toast(L.gatePlan ? 'Ворота закроются сами по проверенному расписанию. Жми «Ветер!».' : 'Это проверенная расстановка. Жми «Ветер!».');
  updateUI();
}

function resetScene() {

  debris.length = 0; st.phase = 'build'; st.msg = null; st.res = null; st.freeze = null; world.energy = 0;

}

    ctx.moveTo(cx + half - 12, cy - 10); ctx.lineTo(cx + half, cy); ctx.lineTo(cx + half - 12, cy + 10);

    const broke = runStep(world, STEP);
    const gates = world.pieces.filter(p => TYPES[p.type].kind === 'gate');
    if (gates.some(g => g.jammed) && !st.jamShown) { st.jamShown = true; st.freeze = { pcs: broke, gates, t: 1.8 }; if (broke.length) st.frozeRun = true; } // заклинило — стоп-кадр с объяснением
    else if (broke.length && !st.frozeRun) { st.frozeRun = true; st.freeze = { pcs: broke, t: 1.6 }; }
    else for (const pc of broke) spawnDebris(pc);
    if (!world.running) { finishRun(); return false; }
  } else if (st.phase === 'result' || st.preview) {
    const pt = st.phase === 'build' ? clock % world.duration : world.duration; // превью проигрывает расписание по кругу
    if (st.phase === 'build' && world.shift && syncDir(world, pt)) resetParticles();
    shedStep(world, clock, STEP);
    simStep(world.sim, STEP, windNow(world, st.phase === 'build' ? pt : clock, false), world.dir);
    if (st.phase === 'build' && (world.mods.drift || world.mods.smoke)) scalarStep(world, STEP, true);
    if (st.phase === 'build') for (const pc of world.pieces) {
      if (!TYPES[pc.type].limit || !pc.ring) continue;
      pc.live = (pc.live || 0) + (pieceLoad(world, pc) - (pc.live || 0)) * 0.06;
    }
  }
  return true;
}
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  // на загрузке, на карте и на паузе поле стоит: не считаем и не рисуем (слабые телефоны)
  if (st.screen !== 'game' || st.paused) return;
  clock += dt;
  acc += dt;
  const STEP = 1 / 60;
  let n = 0;
  // стоп-кадр в момент первой поломки за прогон: дом ещё стоит, подсвечен, видно почему
  if (st.freeze) {
    acc = 0; st.freeze.t -= dt;
    if (st.freeze.t <= 0) { for (const pc of st.freeze.pcs) spawnDebris(pc); st.freeze = null; }
  }
  while (!st.freeze && acc >= STEP && n < 3) {
    acc -= STEP; n++;
    if (!simTick(STEP)) break;
  }
  if (acc > STEP * 3) acc = 0;
  const flowOn = st.phase !== 'build' || st.preview;
  if (!(st.drag && st.drag.kind === 'cam')) cam.a += (cam.target - cam.a) * Math.min(1, dt * 9);
  focusZoom(dt);
  fitView();
  // приближение при переносе сдвигает поле — фигура должна остаться под пальцем
  if (st.drag && (st.drag.kind === 'new' || st.drag.kind === 'move') && st.drag.cx != null && st.fz !== 1) dragTo(st.drag.cx, st.drag.cy);
  if (!st.freeze) {
    if (flowOn) stepParticles(dt);
    stepCars(dt);
    stepDebris(dt);
  }

  ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
  ctx.clearRect(0, 0, view.w, view.h);
  drawBoard();
  if (flowOn && st.layers.heat) drawHeat();
  drawGrid();
  if (st.agent) drawCellNames();
  if (flowOn && world.shift) {
    // смена ветра: оба ряда стрелок видны заранее; активный — ярче
    const t = st.phase === 'run' ? world.t : st.phase === 'build' ? clock % world.duration : world.duration, after = t >= world.shift.at;
    drawInflow(clock, world.baseDir, colors.accent, after ? 0.3 : 1, 'сначала');
    drawInflow(clock, world.shift.dir, SHIFT_COLOR, after ? 1 : 0.55, `через ${world.shift.at} с`);
  } else if (flowOn) drawInflow(clock, world.dir, colors.accent, 1);
  if (flowOn && st.layers.streak) drawStreaks();
  if (flowOn && st.layers.arrow) drawArrows();
  if ((world.mods.drift) && (flowOn || st.phase === 'result')) drawScalar();
  drawPieces(clock);
  if (world.mods.smoke && flowOn) drawScalar();
  drawDebris();
  drawBars();
  drawLabels();
  drawGoals();
  if (st.tut === 'camera') drawSwipeHint(clock);
  if (st.winLater && clock >= st.winLater.t) flushWin();
  // курсор на шкале времени
  if (!$('#tl').hidden) {
    const t = st.phase === 'run' ? world.t : st.phase === 'build' && st.preview ? clock % world.duration : world.duration;
    $('#tl .tl-cur').style.left = Math.min(100, t / world.duration * 100) + '%';
  }
  if (st.phase === 'run' && (world.target || world.pieces.some(p => TYPES[p.type].kind === 'gate'))) updateExtra();
  if (st.phase === 'run') {
    ctx.fillStyle = colors.ink; ctx.textAlign = 'center'; ctx.font = `500 15px ${getComputedStyle(document.body).getPropertyValue('--f-mono')}`;
    ctx.fillText(`${Math.max(0, world.duration - world.t).toFixed(1)} с`, view.free.x + view.free.w / 2, view.free.y + 22);
    $('#go').style.setProperty('--p', Math.min(1, world.t / world.duration).toFixed(3));
  } else $('#go').style.setProperty('--p', 0);
  // стрелка ветра в полосе — куда дует на экране при текущем повороте острова
  const a = P(5, 5, 0), b = P(5 + world.dir[0], 5 + world.dir[1], 0), deg = Math.round(Math.atan2(b[1] - a[1], b[0] - a[0]) * 180 / Math.PI);
  if (deg !== windDeg) { windDeg = deg; $('#windArrow').style.transform = `rotate(${deg}deg)`; }
  placeChips(); placeTrash();
}

// ---------- ИИ-плейтест: ?agent=<имя> (tools/playtest/README.md) ----------
// Агент смотрит на скриншоты и действует командами вместо пальца. Команды дают только то, что видит и может сделать человек:
// ни нагрузок, ни поля ветра, ни решений.
const CELL_X = 'ABCDEFGHIJ';
const cellName = (x, y) => CELL_X[x] + (y + 1);
// подписи клеток, как на шахматной доске: мелко, внутри крайних клеток (снаружи поля — стрелки ветра);
// буквы — вдоль одной стороны, цифры — вдоль другой, крутятся вместе с островом
function drawCellNames() {
  ctx.font = `700 ${Math.max(9, view.tw * 0.22) | 0}px sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = colors.ink; ctx.strokeStyle = colors.bg; ctx.lineWidth = 2.5; ctx.globalAlpha = 0.8;
  const put = (t, x, y) => { const [sx, sy] = P(x, y, 0); ctx.strokeText(t, sx, sy); ctx.fillText(t, sx, sy); };
  for (let i = 0; i < BOARD; i++) {
    put(CELL_X[i], i + 0.5, 0.2); put(CELL_X[i], i + 0.5, BOARD - 0.2);
    put(String(i + 1), 0.2, i + 0.5); put(String(i + 1), BOARD - 0.2, i + 0.5);
  }
  // внутри поля — бледное имя каждой клетки: человек тянет фигуру прямо на пятно, а агенту без них легко промахнуться на клетку
  ctx.font = `600 ${Math.max(7, view.tw * 0.16) | 0}px sans-serif`; ctx.globalAlpha = 0.45; ctx.lineWidth = 2;
  for (let y = 1; y < BOARD - 1; y++) for (let x = 1; x < BOARD - 1; x++) put(cellName(x, y), x + 0.5, y + 0.5);
  ctx.globalAlpha = 1;
}
// счётчики по уровням: прогоны, провалы, подсказки — для кривой сложности
const AGENT_KEY = 'poryv-agent-stats-' + st.agent;
function agentNote(kind) {
  if (!st.agent || st.sandbox || st.screen !== 'game' || st.tut === 'wind') return; // прогон обучения по пустому полю — не провал
  let s = {}; try { s = JSON.parse(localStorage.getItem(AGENT_KEY) || '{}'); } catch (e) {}
  const k = LEVELS[st.level].name, r = s[k] || (s[k] = { order: st.level, runs: 0, fails: 0, hints: 0, won: false });
  if (kind === 'hint') r.hints++;
  else { r.runs++; if (kind === 'fail') r.fails++; else if (kind === 'partial') r.partial = (r.partial || 0) + 1; else if (!r.won) { r.won = true; r.runsToWin = r.runs; } }
  try { localStorage.setItem(AGENT_KEY, JSON.stringify(s)); } catch (e) {}
}
if (st.agent) {
  const shown = el => !!el && el.getClientRects().length > 0;
  const text = sel => { const e = $(sel); return shown(e) ? e.innerText.trim().replace(/\n\s*\n+/g, '\n') : ''; };
  const cellsOf = s => (String(s).toUpperCase().match(/[A-J](10|[1-9])/g) || []).map(c => [CELL_X.indexOf(c[0]), +c.slice(1) - 1]);
  const at = s => { const c = cellsOf(s)[0]; return c ? pieceAt(c[0], c[1]) : null; };
  const typeOf = n => Object.keys(TYPES).find(t => TYPES[t].name.toLowerCase() === String(n).trim().toLowerCase());
  const where = p => pieceCells(p).map(c => cellName(...c)).join(' ');
  const busy = () => (st.screen !== 'game' ? 'Сейчас не уровень' : winKind ? 'Сначала нажми кнопку в окне' : st.phase !== 'build' ? 'Сначала «Ещё раз»' : '');
  // симуляцию двигаем сами, не дожидаясь кадров (свёрнутое окно браузер почти не рисует, а агенту ждать незачем):
  // поле ветра после хода «устаивается» за sec секунд игрового времени, как увидел бы человек
  const settle = (sec = 2) => {
    if (st.screen !== 'game' || st.phase === 'run' || st.paused) return;
    for (let i = 0; i < sec * 60; i++) { clock += 1 / 60; simTick(1 / 60); }
  };
  const done = r => { settle(); return r; };
  window.agent = {
    // что видно на экране, текстом: окна, реплики, итог, запас, кто где стоит, какие кнопки есть
    look() {
      flushWin(); settle(0.5);
      const game = st.screen === 'game';
      return {
        screen: st.screen, level: game && !st.sandbox ? levelText(st.level) : null, phase: game ? st.phase : null,
        window: text('#win'), talk: text('#talkSlot'), result: text('#resultSlot'), toast: text('#toast'), extra: text('#extra'),
        stumps: game ? st.stumps.map(([x, y]) => cellName(x, y)) : [],
        stock: game ? Object.entries(st.inv).filter(([, n]) => n > 0).map(([t, n]) => `${TYPES[t].name} ×${n}`) : [],
        mine: game ? world.pieces.filter(p => !p.fixed).map(p => `${TYPES[p.type].name}: ${where(p)}${p.broken ? ' (сломан)' : ''}`) : [],
        fixed: game ? world.pieces.filter(p => p.fixed).map(p => `${pname(p)}: ${where(p)}${p.broken ? ' (сломан)' : ''}`) : [],
        // обучение: подсвеченные клетки, куда звать забор (человек видит их пульсирующей рамкой)
        highlight: game && st.tut === 'fence' && st.phase === 'build' && fenceState() !== 'ok' ? pieceCells(tutSol()).map(c => cellName(...c)).join(' ') : null,
        buttons: [...document.querySelectorAll('button')].filter(shown).map(b => (b.innerText || b.getAttribute('aria-label') || '').trim().split('\n')[0]).filter(Boolean),
      };
    },
    // нажать видимую кнопку по надписи: «Начать», «Дальше», «Ещё раз», «Подсказка», «пропустить обучение»…
    click(label) {
      const l = String(label).toLowerCase();
      const b = [...document.querySelectorAll('button')].filter(shown).find(e => (e.innerText + ' ' + (e.getAttribute('aria-label') || '')).toLowerCase().includes(l));
      if (!b) return 'Нет такой кнопки на экране';
      if (b.id === 'go') return this.wind();
      b.click(); return done('ok');
    },
    // поставить фигуру из запаса на клетки: agent.place('Забор', 'C4 D4 E4')
    place(name, cells) {
      const b = busy(); if (b) return b;
      const t = typeOf(name); if (!t || !(t in st.inv || (shopOf() || []).includes(t))) return 'В запасе нет фигуры «' + name + '»';
      const want = cellsOf(cells).map(String).sort().join(';'); if (!want) return 'Не понял клетки — пиши как C4';
      if (!canTake(t)) return 'Таких фигур больше нет';
      if (!tryCommit()) return 'Выделенная фигура стоит в красном';
      for (let rot = 0; rot < 4; rot++) for (let y = -2; y < BOARD; y++) for (let x = -2; x < BOARD; x++) {
        const pc = { type: t, x, y, rot };
        if (pieceCells(pc).map(String).sort().join(';') !== want) continue;
        const before = snap(), p = placeAt(t, x, y, rot);
        if (!p) return 'Не встала';
        if (st.selBad) { const why = whyBlocked(p) || 'место занято'; dropPiece(p); returnToStash(p); st.selected = null; st.selBad = false; updateUI(); return 'Сюда не встаёт: ' + why; }
        tryCommit(); record(before); return done('ok: ' + TYPES[t].name + ' ' + where(p));
      }
      return 'Такой формы у фигуры нет — посмотри, сколько клеток она занимает';
    },
    // повернуть свою фигуру, стоящую на клетке
    rotate(cell) {
      const b = busy(); if (b) return b;
      const p = at(cell); if (!p) return 'На клетке нет фигуры'; if (p.fixed) return 'Эта стоит изначально, её не повернуть';
      if (p !== st.selected && !tryCommit()) return 'Выделенная фигура стоит в красном';
      select(p); rotateSel();
      if (st.selBad) { for (let i = 0; i < 3; i++) rotateSel(); tryCommit(); return 'Повёрнутой не помещается — оставил как было'; }
      tryCommit(); return done('ok: ' + TYPES[p.type].name + ' ' + where(p));
    },
    // убрать свою фигуру обратно в запас
    remove(cell) {
      const b = busy(); if (b) return b;
      const p = at(cell); if (!p) return 'На клетке нет фигуры'; if (p.fixed) return 'Эта стоит изначально, её не убрать';
      if (p !== st.selected && !tryCommit()) return 'Выделенная фигура стоит в красном';
      select(p); stashSel(); return done('ok');
    },
    // перенести свою фигуру с клетки на другие клетки: agent.move('C4', 'D5 D6 D7'); не встала — остаётся на старом месте
    move(from, cells) {
      const p = at(from); if (!p || p.fixed) return 'На клетке нет твоей фигуры';
      const name = TYPES[p.type].name, old = where(p), r = this.remove(from);
      if (r !== 'ok') return r;
      const q = this.place(name, cells);
      if (!q.startsWith('ok')) { this.place(name, old); return q + ' — оставил на месте'; }
      return q;
    },
    // тап по клетке поля, как пальцем: в Лесу — срубить дерево (бревно) или посадить обратно на пень
    tap(cell) {
      const b = busy(); if (b) return b;
      const c = cellsOf(cell)[0]; if (!c) return 'Не понял клетку — пиши как C4';
      const [cx, cy] = c, hit = pieceAt(cx, cy);
      if (cutTap(cx, cy, hit)) return done('ok: брёвен ' + st.logs);
      return hit ? `Тут ${pname(hit)} — тап ничего не делает` : 'Пустая клетка — тап ничего не делает';
    },
    // повернуть остров: 1 — по часовой, -1 — против
    turn(k = 1) { turnCam(k > 0 ? 1 : -1); cam.a = cam.target; return 'ok'; },
    // «Ветер!»: прогон считается сразу до конца. Стоп-кадр первой поломки человек видит глазами — агенту он приходит строкой firstBreak
    wind() {
      const b = busy(); if (b) return b;
      go(); if (st.phase !== 'run') return 'Не дует: ' + (text('#toast') || 'проверь, не стоит ли фигура в красном');
      return this.wait();
    },
    // служебное «подождать»: идёт прогон — досчитать до конца, иначе дать полю ветра устояться.
    // Нужна тем, кто играет мышью: нажал «Ветер!» кнопкой — и agent.wait()
    wait() {
      if (st.phase !== 'run') return done(this.look());
      let firstBreak = null;
      for (let i = 0; st.phase === 'run' && i < 60 * 600; i++) {
        if (st.freeze) {
          if (!firstBreak) firstBreak = st.freeze.pcs.map(p => `${pname(p)} ${where(p)} на ${world.t.toFixed(1)} с`).join(', ') || null;
          for (const pc of st.freeze.pcs) spawnDebris(pc); st.freeze = null;
        }
        clock += 1 / 60; simTick(1 / 60);
      }
      return { ...this.look(), firstBreak };
    },
    stats() { try { return JSON.parse(localStorage.getItem(AGENT_KEY) || '{}'); } catch (e) { return {}; } },
    // начать игру с нуля этим игроком
    reset() { try { localStorage.removeItem(SAVE_KEY); localStorage.removeItem(AGENT_KEY); } catch (e) {} setTimeout(() => location.reload(), 50); return 'Перезагрузка: подожди ~10 с и проверь look().screen'; },
  };
}

// ---------- старт ----------
if (st.dev) { document.body.classList.add('dev'); LEVELS.push(...ARCHIVE.map(L => ({ ...L, chapter: 'архив' }))); }
function refreshTheme() { readColors(); if (st.screen === 'game') { buildInv(); updateUI(); } }
readColors();
buildChapters();
const ro = new ResizeObserver(() => resize());
ro.observe($('#stage')); ro.observe($('#topbar')); ro.observe($('#journal'));
addEventListener('resize', resize);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', refreshTheme);
new MutationObserver(refreshTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
resize();
// загрузка → новичок сразу в первый уровень (там обучение), остальные — на карту островов
loading(() => { if (totalStars() === 0) loadLevel(0); else showMap(); });
requestAnimationFrame(t => { last = t; frame(t); });

</script>
