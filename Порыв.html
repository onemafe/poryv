<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0;font:14px system-ui,sans-serif}[hidden]{display:none!important}</style>
</head>
<body>
<title>Порыв</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik+Mono+One&family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Макет: диорама на весь экран, интерфейс — светлые стеклянные панели поверх неё.
   Палитра: пасмурное дневное небо, «картонный» остров, сигнальный жёлтый штормового флага. */
:root {
  --bg: #dfe7ee; --sky1: #c6d3df; --sky2: #dfe7ee; --sky3: #f6f8fa;
  --panel: rgba(255, 255, 255, 0.74); --panel-solid: #ffffff; --line: rgba(30, 50, 75, 0.12);
  --ink: #17212c; --muted: #5a6979; --accent: #f7c21b; --accent-ink: #1c1600;
  --ok: #23955e; --bad: #d63b45; --fill: rgba(30, 50, 75, 0.06); --fill2: rgba(30, 50, 75, 0.11);
  --ground: #ece5d3; --ground2: #e2dac6; --slab: #314a66; --slab2: #26394f; --gridline: rgba(40, 52, 72, 0.13);
  --glass: #36506b;
  --f-display: "Rubik Mono One", "Arial Black", system-ui, sans-serif;
  --f-body: "Golos Text", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
html, body { height: 100%; overflow: hidden; }
[hidden] { display: none !important; }
body {
  background-color: var(--bg);
  background-image: radial-gradient(120% 80% at 50% 38%, var(--sky3) 0%, var(--sky2) 38%, var(--sky1) 100%);
  color: var(--ink); font-family: var(--f-body);
}
#stage { position: fixed; inset: 0; }
canvas#c { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; }

.hud { position: fixed; inset: 0; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between;
  padding-top: max(12px, env(safe-area-inset-top, 0px)); padding-bottom: max(12px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); gap: 10px; }
.hud > * { pointer-events: none; }
.card { pointer-events: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
  -webkit-backdrop-filter: blur(14px) saturate(1.2); backdrop-filter: blur(14px) saturate(1.2); box-shadow: 0 8px 28px rgba(30, 50, 75, 0.14); }

.top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 12px; padding: 8px 10px 8px 14px; flex-wrap: wrap; }
h1 { font: 400 17px/1 var(--f-display); margin: 0; letter-spacing: 0.04em; display: flex; align-items: center; gap: 9px; }
.flag { width: 18px; height: 18px; position: relative; flex: none; }
.flag::before { content: ""; position: absolute; left: 0; top: 0; width: 2px; height: 18px; background: var(--ink); }
.flag::after { content: ""; position: absolute; left: 2px; top: 1px; width: 15px; height: 10px; background: var(--accent); clip-path: polygon(0 0, 100% 50%, 0 100%); }
.levels { display: flex; gap: 4px; }
.chip { font: 600 13px var(--f-body); border: 1px solid transparent; background: var(--fill); color: var(--ink); border-radius: 8px; padding: 6px 10px; cursor: pointer; }
.chip:hover { background: var(--fill2); }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.chip .done { color: var(--ok); }
.chip[aria-pressed="true"] .done { color: inherit; }

.meteo { padding: 10px 14px; display: grid; gap: 6px; min-width: 0; }
.wind { font-size: 12px; color: var(--muted); display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
.wind b { font: 500 20px var(--f-mono); color: var(--ink); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.legend { font: 500 10px var(--f-mono); color: var(--muted); }
.legend .bar { width: 170px; max-width: 100%; height: 6px; border-radius: 3px; margin: 2px 0 3px; background: linear-gradient(90deg, #3d7fb8 0%, #46a9a6 21%, #9ccf5a 39%, #f0c93c 50%, #f08a3a 64%, #d8344c 79%, #9c2a8f 100%); }
.legend .ticks { display: flex; justify-content: space-between; width: 170px; max-width: 100%; font-variant-numeric: tabular-nums; }
.tl { position: relative; width: 240px; max-width: 100%; }
.tl-bar { position: relative; height: 8px; border-radius: 4px; background: var(--fill2); overflow: hidden; }
.tl-gust { position: absolute; top: 0; bottom: 0; background: #f08a3a; }
.tl-shift { position: absolute; top: -1px; bottom: -1px; width: 3px; margin-left: -1px; background: #3d7fb8; }
.tl-cur { position: absolute; top: -3px; width: 2px; height: 14px; margin-left: -1px; background: var(--ink); }
.tl-lbl { display: flex; justify-content: space-between; font: 500 10px var(--f-mono); color: var(--muted); margin-top: 2px; }
.extra { font-size: 12px; color: var(--muted); max-width: 260px; }
.extra b { font-family: var(--f-mono); color: var(--ink); font-weight: 500; }
.levels { flex-wrap: wrap; }
.lv-sep { align-self: center; font: 500 10px var(--f-mono); color: var(--muted); padding: 0 2px 0 6px; text-transform: uppercase; letter-spacing: .06em; }
.hint { font-size: 12px; color: var(--muted); max-width: 240px; text-wrap: balance; }

.bottom { display: grid; gap: 8px; justify-items: center; }
.status { display: flex; justify-content: center; min-height: 0; }
.status span { pointer-events: auto; background: var(--panel-solid); border: 1px solid var(--line); border-radius: 12px; padding: 8px 14px; font-size: 13px; max-width: 560px; text-align: center; box-shadow: 0 8px 24px rgba(30, 50, 75, .16); }
.status span.win { border-color: var(--ok); }
.status span.lose { border-color: var(--bad); }
.status button { margin-left: 8px; }

.dock { width: min(100%, 980px); padding: 8px; display: grid; gap: 8px; }
.inv { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.inv::-webkit-scrollbar { display: none; }
.piece { flex: 0 0 auto; display: grid; grid-template-columns: 40px auto; align-items: center; gap: 1px 8px; text-align: left; border: 1px solid transparent; background: var(--fill); color: var(--ink); border-radius: 10px; padding: 5px 10px 5px 4px; cursor: pointer; font-family: var(--f-body); }
.piece:hover { background: var(--fill2); }
.piece canvas { grid-row: span 2; width: 40px; height: 36px; }
.piece .nm { font-weight: 600; font-size: 13px; white-space: nowrap; }
.piece .nm em { font: 500 12px var(--f-mono); font-style: normal; color: var(--accent); margin-left: 4px; }
.piece .sp { font-size: 11px; color: var(--muted); white-space: nowrap; }
.piece[aria-pressed="true"] { border-color: #d9a400; background: rgba(247, 194, 27, 0.16); }
.piece:disabled { opacity: 0.35; cursor: default; }
/* вертикальный жест по фигуре — тащим её на поле, горизонтальный — прокрутка панели */
.piece { touch-action: pan-x; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.dock.drop { outline: 2px dashed var(--accent); outline-offset: -2px; }
/* обучение: пульсирует то, что нужно нажать; реплика смотрителя */
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(247, 194, 27, 0.75); } 50% { box-shadow: 0 0 0 9px rgba(247, 194, 27, 0); } }
.pulse { animation: pulse 1.4s ease-in-out infinite; }
.status span.coach { border-color: var(--accent); text-align: left; }
.status .who { display: block; font: 600 11px var(--f-body); color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 2px; }
.status .skip { background: none; border: 0; color: var(--muted); font: 500 12px var(--f-body); text-decoration: underline; cursor: pointer; padding: 0; }
/* инструменты разработчика — только с ?dev в адресе */
body:not(.dev) .dev { display: none !important; }

.controls { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--fill); color: var(--ink); font: 600 13px var(--f-body); border-radius: 9px; padding: 8px 11px; cursor: pointer; }
.btn:hover { background: var(--fill2); }
.btn.icon { padding: 8px 10px; min-width: 38px; }
.btn[aria-pressed="true"] { background: var(--ink); color: #fff; }
.sep { width: 1px; align-self: stretch; background: var(--line); margin: 2px 2px; }
.go { margin-left: auto; background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font: 400 14px var(--f-display); letter-spacing: 0.05em; padding: 10px 22px; }
.go:hover { background: #ffd23f; }
.go:disabled { opacity: 0.5; cursor: default; }

.settings { padding: 10px; display: grid; gap: 10px; }
.row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.row .lbl { width: 84px; }
.seg { display: inline-flex; border-radius: 9px; overflow: hidden; border: 1px solid var(--line); }
.seg button { border: 0; background: var(--fill); color: var(--ink); font: 600 12px var(--f-body); padding: 7px 10px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: #fff; }
.sandbox input[type=range] { width: 140px; accent-color: var(--accent); }
.sandbox b { font-family: var(--f-mono); color: var(--ink); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

@media (max-width: 640px) {
  .brand { padding: 6px 8px 6px 10px; gap: 8px; }
  h1 { font-size: 14px; }
  .meteo { padding: 8px 10px; }
  .wind b { font-size: 16px; }
  .hint { max-width: none; }
  .legend .bar, .legend .ticks { width: 120px; }
  .piece .sp { font-size: 10px; }
  .piece { grid-template-columns: 36px auto; }
  .go { padding: 10px 14px; }
  .btn .tx { display: none; }
}
</style>

<div id="stage"><canvas id="c"></canvas></div>

<div class="hud">
  <div class="top" id="topbar">
    <div class="card brand">
      <h1><span class="flag" aria-hidden="true"></span>Порыв</h1>
      <div class="levels" id="levels"></div>
    </div>
    <div class="card meteo">
      <div class="wind" id="wind"></div>
      <div class="legend"><div class="bar"></div><div class="ticks"><span>0</span><span>7</span><span>14</span><span>21</span><span>28 м/с</span></div></div>
      <div class="tl" id="tl" hidden><div class="tl-bar"></div><div class="tl-cur"></div><div class="tl-lbl"><span>0 с</span><span>порывы и смена ветра</span></div></div>
      <div class="extra" id="extra" hidden></div>
      <div class="hint" id="hint"></div>
    </div>
  </div>

  <div class="bottom" id="bottombar">
    <div class="status" id="status"></div>
    <div class="card settings dock" id="settings" hidden>
      <div class="row"><span class="lbl">Слои</span><div class="seg"><button id="lHeat" aria-pressed="true">Поле скоростей</button><button id="lStreak" aria-pressed="true">Струи</button><button id="lArrow" aria-pressed="false">Стрелки</button></div></div>
      <div class="row dev"><span class="lbl">Разрушение</span><div class="seg"><button id="mThr" aria-pressed="true" title="Ломается сразу, как только ветер превысил предел">Порог</button><button id="mHp" aria-pressed="false" title="Короткие порывы терпит, долгий сильный ветер стачивает">Прочность</button></div></div>
      <div class="row"><span class="lbl">Расчёт</span><div class="seg"><button id="prev" aria-pressed="true" title="Поток виден во время расстановки, без разрушений">Превью потока</button><button id="vort" class="dev" aria-pressed="false" title="Усиливает вихри за домами">Вихри</button></div>
        <button class="btn" id="sol" title="Показать проверенную расстановку">Показать решение</button></div>
      <div class="row"><span class="lbl">Подсказки</span><div class="seg"><button id="loads" aria-pressed="false" title="Полоски нагрузки над домами во время расстановки">Нагрузка до прогона</button></div></div>
      <div class="row sandbox" id="sandbox" hidden><span class="lbl">Песочница</span>
        <label>Ветер <b id="wsv">18</b> м/с <input id="ws" type="range" min="6" max="30" step="1" value="18"></label>
        <button class="btn" id="wdir">Направление ↻</button><button class="btn" id="clear">Очистить</button></div>
    </div>
    <div class="card dock">
      <div class="inv" id="inv"></div>
      <div class="controls">
        <button class="btn" id="rot" title="R или правая кнопка мыши">Повернуть ↻</button>
        <button class="btn" id="stash" hidden title="Delete">В запас</button>
        <span class="sep" aria-hidden="true"></span>
        <button class="btn icon" id="camL" title="Камера влево (Q)" aria-label="Повернуть камеру влево">⟲</button>
        <button class="btn icon" id="camR" title="Камера вправо (E)" aria-label="Повернуть камеру вправо">⟳</button>
        <button class="btn icon" id="camHome" title="Вид по умолчанию" aria-label="Вид по умолчанию">⌂</button>
        <span class="sep" aria-hidden="true"></span>
        <button class="btn" id="gear" aria-pressed="false" title="Слои, режим разрушения, расчёт">⚙<span class="tx"> Настройки</span></button>
        <button class="btn go" id="go">Ветер!</button>
      </div>
    </div>
  </div>
</div>

<script>
// ===== Ядро ветра: упрощённый CFD (stable fluids, Jos Stam) =====
// Поле: доска bw×bh клеток, каждая клетка делится на S×S подъячеек, вокруг — поле запаса M клеток.
function createSim(bw, bh, S, M) {
  const nx = (bw + 2 * M) * S, ny = (bh + 2 * M) * S, N = nx * ny;
  const sim = {
    bw, bh, S, M, nx, ny, N,
    u: new Float32Array(N), v: new Float32Array(N),
    u0: new Float32Array(N), v0: new Float32Array(N),
    p: new Float32Array(N), div: new Float32Array(N), curl: new Float32Array(N),
    solid: new Uint8Array(N), drag: new Float32Array(N),
    over: new Float32Array(N),  // «перелёт» ветра через низкие дома: подкачка набегающего потока за пределом тени
    boost: new Float32Array(N), // «сдув вниз» у подножия высоток: ускорение у боковых стен
    W: 10,            // скорость набегающего потока в подъячейках/с
    vort: 0,        // vorticity confinement — «аркадные» вихри
    iters: 40,
    t: 0,
  };
  return sim;
}

function simReset(s, dir) {
  for (let k = 0; k < s.N; k++) {
    s.u[k] = s.solid[k] ? 0 : dir[0] * s.W;
    s.v[k] = s.solid[k] ? 0 : dir[1] * s.W;
    s.p[k] = 0;
  }
  s.t = 0;
}

// клетка доски → индекс первой подъячейки
function subIndex(s, cx, cy, a, b) {
  return ((cy + s.M) * s.S + b) * s.nx + (cx + s.M) * s.S + a;
}

function sample(s, f, x, y) {
  const nx = s.nx, ny = s.ny;
  if (x < 0) x = 0; if (y < 0) y = 0;
  if (x > nx - 1.001) x = nx - 1.001; if (y > ny - 1.001) y = ny - 1.001;
  const i = x | 0, j = y | 0, fx = x - i, fy = y - j, k = j * nx + i;
  return (f[k] * (1 - fx) + f[k + 1] * fx) * (1 - fy) + (f[k + nx] * (1 - fx) + f[k + nx + 1] * fx) * fy;
}

// windVec: [wx, wy] в подъячейках/с (уже с порывами)
function simStep(s, dt, windVec, dir) {
  const { nx, ny, u, v, u0, v0, p, div, solid, drag, curl } = s;
  const W = s.W;
  // 1. «губка» на наветренной стороне держит набегающий поток
  const sponge = s.M * s.S * 0.8;
  for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) {
    let d;
    if (dir[0] > 0) d = i; else if (dir[0] < 0) d = nx - 1 - i; else if (dir[1] > 0) d = j; else d = ny - 1 - j;
    if (d < sponge) {
      const k = j * nx + i, a = 0.35 * (1 - d / sponge);
      u[k] += (windVec[0] - u[k]) * a; v[k] += (windVec[1] - v[k]) * a;
    }
  }
  // 2. vorticity confinement
  if (s.vort > 0) {
    for (let j = 1; j < ny - 1; j++) for (let i = 1; i < nx - 1; i++) {
      const k = j * nx + i;
      curl[k] = 0.5 * ((v[k + 1] - v[k - 1]) - (u[k + nx] - u[k - nx]));
    }
    for (let j = 2; j < ny - 2; j++) for (let i = 2; i < nx - 2; i++) {
      const k = j * nx + i;
      if (solid[k]) continue;
      const gx = 0.5 * (Math.abs(curl[k + 1]) - Math.abs(curl[k - 1]));
      const gy = 0.5 * (Math.abs(curl[k + nx]) - Math.abs(curl[k - nx]));
      const l = Math.hypot(gx, gy) + 1e-5;
      const w = curl[k];
      u[k] += s.vort * (gy / l) * w * dt * 10;
      v[k] -= s.vort * (gx / l) * w * dt * 10;
    }
  }
  // 3. адвекция (полулагранжева)
  u0.set(u); v0.set(v);
  for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) {
    const k = j * nx + i;
    if (solid[k]) { u[k] = 0; v[k] = 0; continue; }
    const x = i - u0[k] * dt, y = j - v0[k] * dt;
    u[k] = sample(s, u0, x, y); v[k] = sample(s, v0, x, y);
  }
  // 4. сопротивление: деревья, ветряки (пористые зоны)
  for (let k = 0; k < s.N; k++) {
    if (drag[k] > 0) { const f = 1 - drag[k]; u[k] *= f; v[k] *= f; }
    if (s.over[k] > 0) { const a = s.over[k]; u[k] += (windVec[0] - u[k]) * a; v[k] += (windVec[1] - v[k]) * a; }
    if (s.boost[k] > 0 && u[k] * dir[0] + v[k] * dir[1] > 0.3 * W) {
      // подтягиваем скорость к (1 + boost)·W, без бесконечного разгона
      const sp = Math.hypot(u[k], v[k]), tgt = (1 + s.boost[k]) * W;
      if (sp < tgt) { const f = Math.min(1.03, tgt / sp); u[k] *= f; v[k] *= f; }
    }
  }
  // 5. проекция (несжимаемость), Гаусс–Зейдель с тёплым стартом
  for (let j = 1; j < ny - 1; j++) for (let i = 1; i < nx - 1; i++) {
    const k = j * nx + i;
    div[k] = solid[k] ? 0 : 0.5 * (u[k + 1] - u[k - 1] + v[k + nx] - v[k - nx]);
  }
  for (let it = 0; it < s.iters; it++) {
    for (let j = 1; j < ny - 1; j++) for (let i = 1; i < nx - 1; i++) {
      const k = j * nx + i;
      if (solid[k]) continue;
      const pc = p[k];
      const pl = solid[k - 1] ? pc : p[k - 1], pr = solid[k + 1] ? pc : p[k + 1];
      const pd = solid[k - nx] ? pc : p[k - nx], pu = solid[k + nx] ? pc : p[k + nx];
      p[k] = (pl + pr + pd + pu - div[k]) * 0.25;
    }
  }
  for (let j = 1; j < ny - 1; j++) for (let i = 1; i < nx - 1; i++) {
    const k = j * nx + i;
    if (solid[k]) continue;
    const pc = p[k];
    const pl = solid[k - 1] ? pc : p[k - 1], pr = solid[k + 1] ? pc : p[k + 1];
    const pd = solid[k - nx] ? pc : p[k - nx], pu = solid[k + nx] ? pc : p[k + nx];
    u[k] -= 0.5 * (pr - pl); v[k] -= 0.5 * (pu - pd);
    // ограничитель — защита от взрывов
    const sp = Math.hypot(u[k], v[k]), mx = W * 3;
    if (sp > mx) { u[k] *= mx / sp; v[k] *= mx / sp; }
  }
  // 6. границы: открытые
  for (let i = 0; i < nx; i++) {
    u[i] = u[i + nx]; v[i] = v[i + nx];
    const a = (ny - 1) * nx + i; u[a] = u[a - nx]; v[a] = v[a - nx];
  }
  for (let j = 0; j < ny; j++) {
    const a = j * nx; u[a] = u[a + 1]; v[a] = v[a + 1];
    const b = a + nx - 1; u[b] = u[b - 1]; v[b] = v[b - 1];
  }
  s.t += dt;
}

if (false) module.exports = { createSim, simReset, simStep, sample, subIndex };

// ===== Постройки, уровни, расчёт нагрузки и разрушения =====

function rotCells(cells, rot) {
  let c = cells.map(([x, y]) => [x, y]);
  for (let r = 0; r < rot; r++) c = c.map(([x, y]) => [-y, x]);
  const mx = Math.min(...c.map(a => a[0])), my = Math.min(...c.map(a => a[1]));
  return c.map(([x, y]) => [x - mx, y - my]);
}
function pieceCells(pc) { return rotCells(TYPES[pc.type].cells, pc.rot).map(([x, y]) => [x + pc.x, y + pc.y]); }

// Мир: доска + симуляция + нагрузки
function createWorld() {
  const sim = createSim(BOARD, BOARD, SUB, MARGIN);
  const w = { sim, pieces: [], windMs: 18, dir: [1, 0], baseDir: [1, 0], mode: 'threshold', running: false, t: 0, gust: true };
  clearMods(w); return w;
}

function occupancy(world, except) {
  const occ = new Map();
  for (const pc of world.pieces) if (pc !== except && !pc.broken) for (const [x, y] of pieceCells(pc)) occ.set(x + ',' + y, pc);
  return occ;
}
function canPlace(world, pc, except) {
  const occ = occupancy(world, except), roads = world.roads;
  const T = TYPES[pc.type];
  return pieceCells(pc).every(([x, y]) => x >= 0 && y >= 0 && x < BOARD && y < BOARD && !occ.has(x + ',' + y)
    && !(roads && roads.has(x + ',' + y)) && !(world.water && world.water.has(x + ',' + y)) && terrainAt(world, x, y) < 3
    && !(world.zone && T.kind === 'shed' && !world.zone.has(x + ',' + y)));
}
// дороги: ломаные по центрам клеток → набор занятых клеток
function roadCells(paths) {
  const set = new Set();
  for (const p of paths || []) for (let i = 1; i < p.length; i++) {
    let [x, y] = p[i - 1]; const [x1, y1] = p[i];
    const dx = Math.sign(x1 - x), dy = Math.sign(y1 - y);
    for (;;) { if (x >= 0 && y >= 0 && x < BOARD && y < BOARD) set.add(x + ',' + y); if (x === x1 && y === y1) break; x += dx; y += dy; }
  }
  return set;
}
function clearMods(world) {
  world.mods = {}; world.terrain = null; world.water = new Set(); world.zone = null;
  world.gusts = null; world.shift = null; world.duration = 8; world.target = 0; world.logs = 0;
}
function applyLevel(world, L) {
  clearMods(world);
  world.windMs = L.wind; world.dir = L.dir.slice(); world.baseDir = L.dir.slice();
  world.roadPaths = L.roads || []; world.roads = roadCells(world.roadPaths);
  world.pieces = L.fixed.map(p => ({ ...p, fixed: true, broken: false, load: 0, hp: 1 }));
  world.mods = { ...(L.mods || {}) };
  world.duration = L.duration || 8;
  world.gusts = L.gusts || null; world.shift = L.shift || null; world.target = L.target || 0;
  world.logs = L.logs || 0;
  if (L.terrain) {
    world.terrain = new Uint8Array(BOARD * BOARD);
    L.terrain.forEach((row, y) => [...row].forEach((ch, x) => {
      if (ch === 'w') world.water.add(x + ',' + y); else world.terrain[y * BOARD + x] = +ch;
    }));
  }
  if (L.forest) {
    const taken = new Set(); for (const p of world.pieces) for (const [x, y] of pieceCells(p)) taken.add(x + ',' + y);
    L.forest.forEach((row, y) => [...row].forEach((ch, x) => {
      if (ch === '1' && !taken.has(x + ',' + y)) world.pieces.push({ type: 'tree', x, y, rot: 0, fixed: true, cut: true, broken: false, load: 0, hp: 1 });
    }));
  }
  if (L.zone) world.zone = new Set(L.zone.map(([x, y]) => x + ',' + y));
}
function terrainAt(world, x, y) { return world.terrain && x >= 0 && y >= 0 && x < BOARD && y < BOARD ? world.terrain[y * BOARD + x] : 0; }

// маски симуляции из построек
function rebuild(world) {
  const s = world.sim;
  s.solid.fill(0); s.drag.fill(0); s.over.fill(0); s.boost.fill(0);
  if (!s.owner) s.owner = new Int16Array(s.N);
  s.owner.fill(-1);
  const hmap = new Float32Array(s.N);
  // рельеф: скалы (3) — сплошные; холмы (1–2) — разгон ветра на вершине
  if (world.terrain) for (let cy = 0; cy < BOARD; cy++) for (let cx = 0; cx < BOARD; cx++) {
    const h = terrainAt(world, cx, cy); if (!h) continue;
    for (let b = 0; b < SUB; b++) for (let a = 0; a < SUB; a++) {
      const k = subIndex(s, cx, cy, a, b);
      if (h >= 3) { s.solid[k] = 1; hmap[k] = 2.2; } else s.boost[k] = HILL_BOOST * h;
    }
  }
  world.pieces.forEach((pc, idx) => { pc.idx = idx; });
  for (const pc of world.pieces) {
    if (pc.broken) continue;
    const T = TYPES[pc.type];
    pc.subs = [];
    if (T.kind === 'loose') continue;            // палатка не мешает ветру, пока лежит
    if (T.kind === 'gate' && pc.open) continue;   // открытые ворота — проход

    const full = [ext(pts[0], pts[1]), ...pts, ext(pts[pts.length - 1], pts[pts.length - 2])];
    let len = 0; for (let i = 1; i < full.length; i++) len += Math.hypot(full[i][0] - full[i - 1][0], full[i][1] - full[i - 1][1]);

}
function stepCars(dt) { for (const c of cars) { c.s = (c.s + c.v * dt + c.len) % c.len; } }
function carPos(c) {
  let s = c.dir > 0 ? c.s : c.len - c.s, p = c.path;
  for (let i = 1; i < p.length; i++) {
    const a = p[i - 1], b = p[i], L = Math.hypot(b[0] - a[0], b[1] - a[1]);
    if (s <= L) {

      const fx = dx * sd, fy = dy * sd, x = a[0] + (b[0] - a[0]) * t - fy * 0.2, y = a[1] + (b[1] - a[1]) * t + fx * 0.2;
      if (x < 0.05 || y < 0.05 || x > BOARD - 0.05 || y > BOARD - 0.05) return null;

}
function drawCar(c, p) {
  const hl = 0.2, hw = 0.11, ax = Math.abs(p.fx) > 0.5;
  const x0 = p.x - (ax ? hl : hw), x1 = p.x + (ax ? hl : hw), y0 = p.y - (ax ? hw : hl), y1 = p.y + (ax ? hw : hl);
  box(x0, y0, x1, y1, 0.02, 0.13, c.col, shade(c.col, 1.05));
  const k = 0.45, cx0 = p.x - (ax ? hl * k : hw * 0.8), cx1 = p.x + (ax ? hl * k : hw * 0.8), cy0 = p.y - (ax ? hw * 0.8 : hl * k), cy1 = p.y + (ax ? hw * 0.8 : hl * k);
  box(cx0 - p.fx * 0.03, cy0 - p.fy * 0.03, cx1 - p.fx * 0.03, cy1 - p.fy * 0.03, 0.13, 0.22, '#c9d6e2', '#e9f0f6');

const isFrozen = pc => !!st.freeze && st.freeze.pcs.includes(pc);
function drawPieces(time) {
  const items = [];
  for (const pc of world.pieces) {
    if (pc.broken && !isFrozen(pc)) continue;
    const cells = pieceCells(pc), set = new Set(cells.map(c => c[0] + ',' + c[1]));
    for (const [x, y] of cells) items.push({ pc, x, y, set });
  }
  let ghostOk = true, ghost = null;
  const d = st.drag, dragging = d && (d.kind === 'piece' || d.kind === 'new') && d.moved;
  if (st.phase === 'build' && st.hover && (st.sel || dragging)) {
    ghost = dragging ? { type: d.kind === 'new' ? d.type : d.pc.type, x: st.hover[0] - d.off[0], y: st.hover[1] - d.off[1], rot: d.kind === 'new' ? st.rot : d.pc.rot }
      : { type: st.sel, x: st.hover[0], y: st.hover[1], rot: st.rot };
    ghostOk = canPlace(world, ghost);
    const cells = pieceCells(ghost), set = new Set(cells.map(c => c[0] + ',' + c[1]));
    for (const [x, y] of cells) if (inBoard(x + 0.5, y + 0.5, 0)) items.push({ pc: ghost, x, y, set, ghost: true });
  }
  for (const c of cars) { const p = carPos(c); if (p) items.push({ car: c, p, x: p.x - 0.5, y: p.y - 0.5 }); }
  if (world.terrain) for (let y = 0; y < BOARD; y++) for (let x = 0; x < BOARD; x++) if (terrainAt(world, x, y) >= 3) items.push({ cliff: true, x, y });
  for (const pc of world.pieces) {
    if (pc.broken || TYPES[pc.type].kind !== 'loose') continue;
    const f = pc.flying || (pc.landed && !pc.landed.gone ? { x: pc.landed.x, y: pc.landed.y, z: 0, a: pc.landed.a || 1.2 } : null);
    if (f) items.push({ tent: pc, f, x: f.x - 0.5, y: f.y - 0.5 });
  }
  for (const it of items) it.d = depth(it.x + 0.5, it.y + 0.5);
  items.sort((a, b) => a.d - b.d);
  if (st.picked && st.phase === 'build' && world.pieces.includes(st.picked)) {
    ctx.lineWidth = 2;
    for (const [x, y] of pieceCells(st.picked)) poly([P(x, y, 0.01), P(x + 1, y, 0.01), P(x + 1, y + 1, 0.01), P(x, y + 1, 0.01)], colors.accent + '33', colors.accent);
    ctx.lineWidth = 1;
  }
  const cellRing = (cells, fill, stroke, w) => {
    ctx.lineWidth = w;
    for (const [x, y] of cells) { zOff = groundZ(x + 0.5, y + 0.5); poly([P(x, y, 0.01), P(x + 1, y, 0.01), P(x + 1, y + 1, 0.01), P(x, y + 1, 0.01)], fill, stroke); }
    zOff = 0; ctx.lineWidth = 1;
  };
  // обучение: куда поставить забор
  if (st.tut === 'fence' && st.phase === 'build' && invLeft() > 0 && !dragging) {
    const a = 0.5 + 0.5 * Math.sin(time * 5);
    cellRing(pieceCells(LEVELS[st.level].solution[0]), `rgba(247,194,27,${(0.12 + 0.25 * a).toFixed(2)})`, colors.accent, 2.5);
  }
  // стоп-кадр поломки
  if (st.freeze) {
    const a = 0.5 + 0.5 * Math.sin(time * 9);
    for (const pc of st.freeze.pcs) cellRing(pieceCells(pc), `rgba(214,59,69,${(0.2 + 0.3 * a).toFixed(2)})`, colors.bad, 3);
  }
  for (const it of items) {
    if (it.car) { drawCar(it.car, it.p); continue; }
    if (it.cliff) { drawCliff(it.x, it.y); continue; }
    if (it.tent) { zOff = groundZ(it.f.x, it.f.y); drawTent(it.f.x, it.f.y, it.f.z, it.f.a, TYPES[it.tent.type]); zOff = 0; continue; }
    zOff = groundZ(it.x + 0.5, it.y + 0.5);
    if (it.ghost) { ctx.globalAlpha = 0.55; }
    drawCell(it.pc, it.x, it.y, it.set, time, it.ghost);
    if (it.ghost) {
      ctx.globalAlpha = 1;
      poly([P(it.x, it.y, 0.01), P(it.x + 1, it.y, 0.01), P(it.x + 1, it.y + 1, 0.01), P(it.x, it.y + 1, 0.01)], null, ghostOk ? colors.accent : colors.bad);

}
// подписи режимов над постройками: энергия ветряков, бонус сцепки
function drawLabels() {
  const mono = getComputedStyle(document.body).getPropertyValue('--f-mono');
  ctx.font = `600 11px ${mono}`; ctx.textAlign = 'center';
  const tag = (x, y, z, txt, bg, fg) => {
    zOff = groundZ(x, y); const [sx, sy] = P(x, y, z); zOff = 0;
    const w = ctx.measureText(txt).width + 8;
    ctx.fillStyle = bg; ctx.fillRect(sx - w / 2, sy - 13, w, 15); ctx.fillStyle = fg; ctx.fillText(txt, sx, sy - 2);
  };
  for (const pc of world.pieces) {
    const T = TYPES[pc.type];
    if (pc.broken && T.limit && st.phase !== 'build') {
      // почему сломалось: над домом в стоп-кадре, на месте дома — после прогона
      const c = pieceCells(pc), mx = c.reduce((a, q) => a + q[0], 0) / c.length + 0.5, my = c.reduce((a, q) => a + q[1], 0) / c.length + 0.5;
      const why = pc.brokeBy === 'tent' ? 'удар палаткой' : `ветер > ${limitOf(world, pc)} м/с`;
      if (isFrozen(pc)) { ctx.font = `600 13px ${mono}`; tag(mx, my, T.h + 1.1, `${T.name}: ${why}`, 'rgba(214,59,69,.95)', '#fff'); ctx.font = `600 11px ${mono}`; }
      else if (!st.freeze) tag(mx, my, 0.35, `сдуло · ${why}`, 'rgba(214,59,69,.88)', '#fff');
      continue;
    }
    if (pc.broken) continue;
    if (world.target && T.kind === 'mill' && st.phase !== 'build') tag(pc.x + 0.5, pc.y + 0.5, T.h + 0.75, `⚡${Math.round(pc.energy || 0)}`, 'rgba(255,210,63,.92)', '#1c1600');
    if (world.mods.cohesion && isHouse(T) && st.phase === 'build' && pc.adj) {
      const c = pieceCells(pc); const mx = c.reduce((a, q) => a + q[0], 0) / c.length + 0.5, my = c.reduce((a, q) => a + q[1], 0) / c.length + 0.5;
      tag(mx, my, T.h + 0.35, `+${Math.min(3, pc.adj) * 3}`, 'rgba(35,149,94,.92)', '#fff');

}
function drawBars() {
  const build = st.phase === 'build';
  if (build && (!st.preview || !st.showLoads)) return;
  const mono = getComputedStyle(document.body).getPropertyValue('--f-mono');
  for (const pc of world.pieces) {
    const T = TYPES[pc.type];
    if ((pc.broken && !isFrozen(pc)) || !T.limit) continue;
    if (build && pc.cut) continue;
    if (build) { // превью: текущая нагрузка от предпросмотра потока
      const cells = pieceCells(pc);
      const mx = cells.reduce((a, c) => a + c[0], 0) / cells.length + 0.5, my = cells.reduce((a, c) => a + c[1], 0) / cells.length + 0.5;
      zOff = groundZ(mx, my); const [sx, sy] = P(mx, my, T.h + 0.45); zOff = 0;
      const lim = limitOf(world, pc), r = (pc.live || 0) / lim, w = Math.max(30, view.tw * 0.85), h = 5;
      ctx.fillStyle = 'rgba(12,21,34,.75)'; ctx.fillRect(sx - w / 2 - 1, sy - 1, w + 2, h + 2);
      ctx.fillStyle = r > 1 ? colors.bad : r > 0.85 ? '#e9a23b' : colors.ok;
      ctx.fillRect(sx - w / 2, sy, w * Math.min(1, r), h);
      if (st.picked === pc || r > 0.85) {
        ctx.font = `500 11px ${mono}`; ctx.textAlign = 'center';
        const txt = `${(pc.live || 0).toFixed(0)} / ${lim} м/с`;
        const tw2 = ctx.measureText(txt).width + 8;
        ctx.fillStyle = 'rgba(12,21,34,.82)'; ctx.fillRect(sx - tw2 / 2, sy - 17, tw2, 14);
        ctx.fillStyle = r > 1 ? '#ff9a9a' : '#fff'; ctx.fillText(txt, sx, sy - 6);
      }
      continue;
    }
    const cells = pieceCells(pc);
    const mx = cells.reduce((a, c) => a + c[0], 0) / cells.length + 0.5, my = cells.reduce((a, c) => a + c[1], 0) / cells.length + 0.5;
    zOff = groundZ(mx, my); const [sx, sy] = P(mx, my, T.h + 0.45); zOff = 0;
    const w = Math.max(26, view.tw * 0.8), h = 5, lim = limitOf(world, pc);
    const frac = world.mode === 'hp' ? pc.hp : Math.min(1, pc.load / lim);
    const danger = world.mode === 'hp' ? 1 - pc.hp : pc.load / lim;
    ctx.fillStyle = 'rgba(12,21,34,.8)'; ctx.fillRect(sx - w / 2 - 1, sy - 1, w + 2, h + 2);
    ctx.fillStyle = danger > 0.85 ? colors.bad : danger > 0.6 ? '#e9a23b' : colors.ok;

    if (world.mods.smoke && pc.fixed && isHouse(T) && T.kind !== 'shed') { r2 = (pc.expo || 0) / 0.2; c2 = '#8c867e'; }
    if (r2 >= 0) {
      ctx.fillStyle = 'rgba(12,21,34,.8)'; ctx.fillRect(sx - w / 2 - 1, sy + h + 3, w + 2, h + 2);
      ctx.fillStyle = r2 > 1 ? colors.bad : c2; ctx.fillRect(sx - w / 2, sy + h + 4, w * Math.min(1, r2), h);

}

// обломки
function spawnDebris(pc) {
  const T = TYPES[pc.type];
  for (const [cx, cy] of pieceCells(pc)) for (let i = 0; i < 7; i++) {
    debris.push({ x: cx + Math.random(), y: cy + Math.random(), z: Math.random() * T.h, vx: 0, vy: 0, vz: 1 + Math.random() * 2, a: Math.random() * 6, va: (Math.random() - 0.5) * 12, life: 3, col: Math.random() < 0.4 ? T.roof : T.color, s: 0.12 + Math.random() * 0.14 });
  }
}
function stepDebris(dt) {
  const s = world.sim;
  for (let i = debris.length - 1; i >= 0; i--) {
    const d = debris[i];
    const si = (d.x + MARGIN) * SUB, sj = (d.y + MARGIN) * SUB;
    const u = sample(s, s.u, si, sj) / SUB, v = sample(s, s.v, si, sj) / SUB;
    const lift = d.z > 0.01 ? 1 : 0.35;
    d.vx += (u * 1.4 - d.vx) * dt * 2.5 * lift; d.vy += (v * 1.4 - d.vy) * dt * 2.5 * lift;
    d.vz -= 6 * dt; d.x += d.vx * dt; d.y += d.vy * dt; d.z += d.vz * dt;
    if (d.z < 0) { d.z = 0; d.vz *= -0.3; }
    d.a += d.va * dt; d.life -= dt;
    if (d.life <= 0) debris.splice(i, 1);

function drawDebris() {
  for (const d of debris) {
    const [sx, sy] = P(d.x, d.y, d.z), r = d.s * view.tw * 0.5;
    ctx.save(); ctx.translate(sx, sy); ctx.rotate(d.a); ctx.globalAlpha = Math.min(1, d.life);
    ctx.fillStyle = d.col; ctx.fillRect(-r, -r * 0.7, r * 2, r * 1.4);
    ctx.restore();
  }
}

function drawIcon(c, t) {
  const g = c.getContext('2d');
  const save = { ...view }, sc = { ...cam };
  cam.cos = 1; cam.sin = 0;
  const T = TYPES[t];
  const cells = rotCells(T.cells, 0);
  const w = Math.max(...cells.map(a => a[0])) + 1, h = Math.max(...cells.map(a => a[1])) + 1;
  view.tw = Math.min(64 / (w + h) * 2, 40); view.hz = view.tw * 0.52;
  const hh = Math.min(T.h, 3.3) * view.hz;
  view.ox = 44 + (h - w) * view.tw / 4; view.oy = (80 - (w + h) * view.tw / 4 + hh) / 2;
  g.clearRect(0, 0, 88, 80);
  withCtx(g, () => {
    const pc = { type: t, x: 0, y: 0, rot: 0, ang: 0.6 };
    const set = new Set(cells.map(a => a[0] + ',' + a[1]));
    cells.slice().sort((a, b) => a[0] + a[1] - b[0] - b[1]).forEach(([x, y]) => drawCell(pc, x, y, set, 0, true));
  });
  Object.assign(view, save); Object.assign(cam, sc);
}
function withCtx(g, fn) { const old = ctx; ctx = g; try { fn(); } finally { ctx = old; } }

// ---------- цикл ----------
let last = performance.now(), acc = 0, clock = 0;
function frame(now) {
  let dt = Math.min(0.05, (now - last) / 1000); last = now; clock += dt;
  acc += dt;
  const STEP = 1 / 60;
  let n = 0;
  // стоп-кадр в момент первой поломки за прогон: дом ещё стоит, подсвечен, видно почему
  if (st.freeze) {
    acc = 0; st.freeze.t -= dt;

  }

    acc -= STEP; n++;

        const shut = st.autoGate.some(([a, b]) => world.t >= a && world.t < b);
        if (pc.open === shut) { pc.open = !shut; rebuild(world); }
      }

      if (broke.length && !st.frozeRun) { st.frozeRun = true; st.freeze = { pcs: broke, t: 1.6 }; }
      else for (const pc of broke) spawnDebris(pc);

      simStep(world.sim, STEP, windNow(world, st.phase === 'build' ? pt : clock, false), world.dir);
      if (st.phase === 'build' && (world.mods.drift || world.mods.smoke)) scalarStep(world, STEP, true);
      if (st.phase === 'build') for (const pc of world.pieces) {
        if (!TYPES[pc.type].limit || !pc.ring) continue;
        pc.live = (pc.live || 0) + (pieceLoad(world, pc) - (pc.live || 0)) * 0.06;
      }
    }
  }
  if (acc > STEP * 3) acc = 0;
  const flowOn = st.phase !== 'build' || st.preview;
  if (!(st.drag && st.drag.kind === 'cam' && st.drag.moved)) cam.a += (cam.target - cam.a) * Math.min(1, dt * 9);

  if (!st.freeze) {
    if (flowOn) stepParticles(dt);
    stepCars(dt);
    stepDebris(dt);

  ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
  ctx.clearRect(0, 0, view.w, view.h);

  if (flowOn && st.layers.heat) drawHeat();
  drawGrid();
  if (flowOn) drawInflow(clock);
  if (flowOn && st.layers.streak) drawStreaks();
  if (flowOn && st.layers.arrow) drawArrows();
  if ((world.mods.drift) && (flowOn || st.phase === 'result')) drawScalar();
  drawPieces(clock);
  if (world.mods.smoke && flowOn) drawScalar();
  drawDebris();
  drawBars();
  drawLabels();
  // курсор на шкале времени
  if (!$('#tl').hidden) {
    const t = st.phase === 'run' ? world.t : st.phase === 'build' && st.preview ? clock % world.duration : world.duration;
    $('#tl .tl-cur').style.left = Math.min(100, t / world.duration * 100) + '%';
  }
  if (st.phase === 'run' && (world.target || world.pieces.some(p => TYPES[p.type].kind === 'gate'))) updateExtra();
  if (st.phase === 'run') {
    ctx.fillStyle = colors.ink; ctx.font = `500 12px ${getComputedStyle(document.body).getPropertyValue('--f-mono')}`;
    ctx.textAlign = 'center'; ctx.font = `500 15px ${getComputedStyle(document.body).getPropertyValue('--f-mono')}`;
    ctx.fillText(`${Math.max(0, world.duration - world.t).toFixed(1)} с`, view.w / 2, view.insTop + 22);
  }

}

// ---------- старт ----------
function refreshTheme() { readColors(); buildInv(); updateUI(); }
readColors();
const ro = new ResizeObserver(resize);
ro.observe($('#stage')); ro.observe($('#topbar')); ro.observe(document.querySelector('.dock:not(#settings)'));
$('#gear').onclick = () => { const s = $('#settings'); s.hidden = !s.hidden; $('#gear').setAttribute('aria-pressed', !s.hidden); };
resize();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', refreshTheme);
new MutationObserver(refreshTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
loadLevel(0);
requestAnimationFrame(t => { last = t; frame(t); });
